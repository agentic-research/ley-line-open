name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Runners persist this directory with actions/cache. Local Taskfile users
  # intentionally retain sccache's platform-default cache so compiler outputs
  # remain reusable across sibling repositories/worktrees.
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  SCCACHE_CACHE_SIZE: 2G

# CI is the same gate as local dev: every step delegates to a Taskfile
# entry. If a check isn't reachable via `task <name>`, it doesn't belong
# in CI either. Adding a new gate? Add it to Taskfile.yml first, then
# add a step here that calls it.
#
# ## Two tiers, selected by where the change is GOING
#
# The gate scales with what merging would commit us to, not with the event:
#
#   feature -> integration   `task ci`. Fast, run constantly. Integration is
#                            where work converges; a slow gate here is paid on
#                            every iteration and buys nothing that the
#                            promotion gate will not catch.
#
#   * -> main                `task ci` + the release-profile perf gate + the
#                            version-consistency check. `main` is what releases
#                            are cut from, so an integration -> main promotion
#                            is the last point where a regression is cheap to
#                            stop. This is `task ci:full` plus the release
#                            gate, spelled out as steps so a failure names the
#                            gate that failed.
#
# Selecting on `github.base_ref` rather than on the event is the point. Perf
# used to run only on PUSH to main — i.e. after the merge had already landed,
# where a failure reports a regression instead of preventing one.
jobs:
  ci:
    name: Check + Clippy + Test (task ci)
    runs-on: ubuntu-latest
    # A hung test otherwise burns GitHub's 6-hour default. This job's observed
    # range is 9-11 min (runs 32059251009, 32071678194), so 30 leaves ~3x
    # headroom for a cold cache while still failing a wedge in minutes.
    #
    # Not hypothetical: `KrunWorkerBackend::start` can block indefinitely
    # inside `Command::spawn`, and did — 1h33m at 0% CPU, killed by hand
    # (bead `ley-line-open-cdd5d0`). This bounds the blast radius; it is not
    # the fix for that bug.
    timeout-minutes: 30
    steps:
      # SHA-pinned: actions/checkout@v6.0.2 (Node 24)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # SHA-pinned: dtolnay/rust-toolchain (composite action — Node version
      # deprecation does not apply; latest commit on master as of 2026-03).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          # Must equal rust-toolchain.toml's `channel` — enforced by
          # `task lint:toolchain-parity`. Stable, not nightly: nothing in
          # `rs/` uses a `#![feature(...)]`, so the old nightly pin (bead
          # `ley-line-open-75444d`, dodging an ICE on `#[test]` +
          # `#[serial(<key>)]`) was babysitting a dependency we never needed.
          toolchain: 1.97.1
          components: clippy, rustfmt

      # Cargo registry + rs/target cache. Median ~40-60s saved per run
      # at ~70-80% hit rate on consecutive PRs; cold runs (semver bump,
      # lockfile change) pay full price as before. Swatinem/rust-cache@v2
      # handles auto-invalidation on lockfile / rust-toolchain version
      # changes, so we don't manage cache keys ourselves. The action
      # scopes the cache by job name + OS, so PR and main runs don't
      # cross-pollinate.
      # SHA-pinned: Swatinem/rust-cache@v2.7.7.
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          workspaces: rs
          # sccache owns compiler-output reuse. Retaining target/ as well
          # duplicates a much larger, path-sensitive cache and still did not
          # prevent the v0.10.2 rust-lld SIGBUS. rust-cache continues to cache
          # the Cargo registry/git inputs.
          cache-targets: false

      # SHA-pinned: arduino/setup-task@v2.0.0 (Taskfile runner, the golden
      # path; see Taskfile.yml at the repo root).
      # TODO: bump to a Node 24 release once arduino/setup-task#1359 ships
      # (Node 20 is force-defaulted June 2 2026, removed Sept 16 2026).
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          # Exact, not `3.x`: a floating minor means the runner can pick up a
          # new go-task whose behaviour differs from the one developers have,
          # which is the same class of drift rust-toolchain.toml exists to
          # close. Bump deliberately, together with local installs.
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # System deps (libfuse for fuser, capnproto + libcapnp-dev for schema
      # build.rs, libdbus-1-dev for keyring) live in Taskfile deps:ci —
      # single source across ci.yml/release.yml/release-dryrun.yml/
      # leyline-schema-go.yml, enforced by `task lint:workflow-parity`
      # (bead ley-line-open-2bea72).
      - name: Install system deps
        run: task deps:ci

      # Compiler outputs use the same Taskfile-managed sccache path locally
      # and on runners. The Taskfile pins + verifies the executable; this
      # action only restores its content-addressed data.
      # SHA-pinned: actions/cache@v6.1.0 (Node 24).
      - name: Restore sccache compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-

      - name: Install pinned sccache through Taskfile
        run: task cache:sccache:install

      - name: Reset sccache statistics
        run: task cache:sccache:zero

      - name: Run task ci (check + clippy + fmt + FFI staticlib + tier isolation + test)
        run: task ci

      - name: Report sccache statistics
        if: always()
        run: task cache:sccache:stats

      # Perf regression gate — the release-profile build adds ~90-120s, so a
      # PR targeting `integration` does not pay it. A PR targeting `main` does:
      # that is the promotion into the branch releases are cut from, and it is
      # the last point where stopping a regression is cheap. Still runs on push
      # to main as a backstop for anything that reaches main without a PR.
      #
      # Authors of perf-sensitive changes should run `task ci:full` locally
      # before requesting review, whichever branch they are targeting.
      - name: Run task test:perf (main-bound changes only)
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: task test:perf

      # Version consistency across binary, schema, generated metadata and docs.
      # Only meaningful on the main-bound path: `integration` legitimately
      # carries unreleased work whose versions have not been reconciled yet,
      # so running this on every feature PR would fail for a reason that is not
      # a defect. Immediately before a release cut, it is exactly the check
      # that matters.
      - name: Run task release:version-check (main-bound changes only)
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: task release:version-check
