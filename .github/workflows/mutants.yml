name: Mutation testing

# Checks the TESTS, not the code: rewrites the source in small ways and fails
# if the suite still passes. It catches the class of defect a correctness test
# structurally cannot — e.g. widening the chunk-overlap predicate, which
# returns identical bytes while fetching chunks it never needed.
#
# Path-filtered and separate from `ci.yml` because it takes ~17 min. Same
# taskfile-ci-parity rule as everything else: this workflow invokes
# `task mutants`, it does not re-implement the command.
# Broadened to all Rust (`ley-line-open-085dff`). Previously this fired only on
# the allowlist paths, so a PR touching `partition.rs` or the schema-bridge
# emitters — the two places that produced silent wrong-output bugs this week —
# got no mutation coverage at all.
#
# Broadening is affordable only because the diff-scoped run costs time
# proportional to the DIFF rather than the codebase. The expensive allowlist run
# stays conditional on the allowlist actually being touched; see the step guard
# below. Without that guard this would add ~17 min to every Rust PR, and a gate
# people route around has already failed.
#
# Also tiered by TARGET (`ley-line-open-804f7e`): the allowlist run only fires
# on integration -> main PRs, never on feature -> integration PRs, mirroring
# ci.yml's existing base_ref tiering rather than inventing a second axis.
# A feature PR still gets `mutants:diff`, scoped to its own diff; the
# allowlist's full-module sweep runs once, at the promotion gate, where the
# diff against main naturally accumulates everything a release bundles.
on:
  pull_request:
    branches: [main, integration]
    paths:
      - 'rs/**'
      - 'Taskfile.yml'
      - '.github/workflows/mutants.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The slices are independent and were always parallelisable; running them as one
# serial job is what put this gate at 80m16s against a 90-minute ceiling — 11%
# headroom, thinner than the run-to-run variance that cancelled `task ci` twice
# on 2026-09-01 (`ley-line-open-908b68`). The comment below used to say the fix
# was a matrix "if a future diff arm approaches this too". It did, so this is it.
#
# Shape: `plan` decides what has work (no cargo, seconds), then the allowlist arm
# and one leg per diff scope run CONCURRENTLY, and `mutants` aggregates them
# under the name branch protection already requires. Wall clock becomes
# max(allowlist, slowest leg) instead of allowlist + sum(every leg).
jobs:
  # Cheap, cargo-free planning. Emits the scopes with work, so the matrix has a
  # leg only where there is something to mutate — a fixed five-leg matrix would
  # red four legs on most PRs, because a scoped run that matches nothing is a
  # deliberate hard MISCONFIGURED (`task mutants:diff cli` typed by hand must
  # not pass having mutated nothing).
  #
  # The pairing assertion — every package the generic slice excludes is owned by
  # some scope — lives inside `list-scopes` for the same reason. Split across
  # legs it would be vacuous in each, and a package owned by nobody would
  # surface as a green matrix of skipped legs.
  plan:
    name: plan mutation scopes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scopes: ${{ steps.plan.outputs.scopes }}
      any: ${{ steps.plan.outputs.any }}
      allowlist: ${{ steps.scope.outputs.allowlist }}
    steps:
      # SHA-pinned: actions/checkout@v6.0.2 (Node 24)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate workspace-relative diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git diff --relative=rs "$BASE_SHA...$HEAD_SHA" -- rs/ > /tmp/pr.diff
          wc -l < /tmp/pr.diff

      - name: Decide which runs apply
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [ "$BASE_REF" = "main" ] && printf '%s\n' "$changed" | grep -qE \
            '^(rs/ll-open/cdc/.*\.rs$|rs/ll-open/fs/src/(chunked|gc)\.rs|rs/ll-core/core/src/partition\.rs|Taskfile\.yml|tools/mutants_diff\.sh|\.github/workflows/mutants\.yml)'; then
            echo "allowlist=true" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_REF" != "main" ]; then
            echo "allowlist=false" >> "$GITHUB_OUTPUT"
            echo "::notice::allowlist run skipped — reserved for integration -> main promotions (ley-line-open-804f7e)"
          else
            echo "allowlist=false" >> "$GITHUB_OUTPUT"
            echo "::notice::allowlist run skipped — this PR touches none of the covered modules"
          fi

      # `list-scopes` runs no cargo, so this needs neither the toolchain nor
      # cargo-mutants. It fails loudly when a changed package is owned by no
      # scope; that failure must stop the whole workflow rather than yield an
      # empty matrix, which `set -eu` gives us.
      - name: Plan the diff scopes
        id: plan
        run: |
          set -eu
          # `--silent` rather than filtering task's command echo with a grep
          # for the scope names. That grep would be a FIFTH copy of the list
          # MUTATION_SCOPE_PACKAGES exists to be the only copy of, and it would
          # fail open: a scope added to the table but missing from the pattern
          # would be silently dropped from the matrix, and the leg that should
          # have mutated it would never run.
          scopes=$(task --silent mutants:diff DIFF=/tmp/pr.diff MUTANTS_SCOPE=list-scopes)
          if [ -z "$scopes" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo 'scopes=[]' >> "$GITHUB_OUTPUT"
            echo "::notice::no mutation scope has work for this diff"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          json=$(printf '%s\n' "$scopes" | jq -R . | jq -sc .)
          echo "scopes=$json" >> "$GITHUB_OUTPUT"
          echo "::notice::mutation scopes for this diff: $(printf '%s' "$scopes" | tr '\n' ' ')"

  # Full coverage of the modules carrying falsifiable claims. Answers "do the
  # tests for THOSE modules still bite?" Now a sibling of the diff legs rather
  # than a step before them, so its ~17 minutes stop being added to theirs.
  allowlist:
    name: cargo mutants (allowlist)
    needs: plan
    if: needs.plan.outputs.allowlist == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # SHA-pinned: actions/checkout@v6.0.2 (Node 24)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1  # must equal rust-toolchain.toml (task lint:toolchain-parity)
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          workspaces: rs
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install system deps
        run: task deps:ci
      - name: Install cargo-mutants
        run: task deps:cargo-mutants
      - name: task mutants (allowlist)
        run: task mutants
      - name: Upload mutants report
        if: always()
        # SHA-pinned: actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-report-allowlist
          path: rs/mutants.out/
          if-no-files-found: ignore

  # One leg per scope with work. `fail-fast: false` so a survivor in one slice
  # does not cancel the others — the report from every slice is the point, and
  # cancelling siblings would hide whether the failure was isolated.
  #
  # 60, not 90: this ceiling now bounds ONE slice rather than the whole gate.
  # The worst single slice measured is cli-lib at 49 min on the projection-v5
  # PR (106 mutants, `--features vec`), so 60 leaves ~20% headroom on the
  # slowest known leg — where the old 90 left 11% on the serial total. If a
  # single slice ever approaches this, the next move is splitting THAT slice,
  # not lifting the number: a slice too slow to fit is a slice doing too much.
  diff:
    name: cargo mutants (${{ matrix.scope }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.plan.outputs.scopes) }}
    steps:
      # SHA-pinned: actions/checkout@v6.0.2 (Node 24)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # The diff-scoped run needs the merge base, which a depth-1 checkout
          # does not have. Without this, the diff comes out empty and
          # `mutants:diff` reports SKIPPED — green, having tested nothing.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1  # must equal rust-toolchain.toml (task lint:toolchain-parity)
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          workspaces: rs
          # Legs share a cache key by default and would race writing it. Keyed
          # per scope so each leg reuses its own warm target dir instead.
          key: mutants-${{ matrix.scope }}
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install system deps
        run: task deps:ci
      - name: Install cargo-mutants
        run: task deps:cargo-mutants

      # `--relative=rs` is load-bearing. cargo-mutants runs in `rs/`, so the
      # diff's paths must be workspace-relative (`a/ll-core/...`). A diff made
      # from the repo root carries `a/rs/ll-core/...`, matches nothing, prints
      # "No mutants to filter" and EXITS 0 — a permanently green check that
      # tests nothing, from a path prefix. Regenerated per leg because each
      # matrix leg is a fresh runner with its own checkout.
      - name: Generate workspace-relative diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git diff --relative=rs "$BASE_SHA...$HEAD_SHA" -- rs/ > /tmp/pr.diff
          wc -l < /tmp/pr.diff

      - name: task mutants:diff (${{ matrix.scope }})
        run: task mutants:diff DIFF=/tmp/pr.diff MUTANTS_SCOPE=${{ matrix.scope }}

      - name: Upload mutants report
        if: always()
        # SHA-pinned: actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-report-${{ matrix.scope }}
          path: rs/mutants.out/
          if-no-files-found: ignore

  # Stable aggregate. Branch protection requires THIS name, and matrix leg names
  # vary with the plan, so the required check cannot be a leg. It must also fail
  # closed: `needs` alone would let a skipped or cancelled upstream job pass, so
  # every non-success result is checked explicitly.
  mutants:
    # Named for WHAT IT COVERS, not for the command it runs. It previously read
    # `cargo mutants (task mutants)`, which on a PR touching both Taskfile.yml
    # and unrelated source rendered as an unqualified green — a reader
    # reasonably concluded the PR's new logic survived mutation testing, when
    # the run had covered the CDC allowlist and nothing the PR changed
    # (`ley-line-open-085dff`).
    name: cargo mutants (allowlist + this PR's diff)
    needs: [plan, allowlist, diff]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mutation job to have succeeded or been legitimately skipped
        env:
          PLAN: ${{ needs.plan.result }}
          ALLOWLIST: ${{ needs.allowlist.result }}
          DIFF: ${{ needs.diff.result }}
        run: |
          set -eu
          echo "plan=$PLAN allowlist=$ALLOWLIST diff=$DIFF"
          # `plan` must actually have run: it carries the pairing assertion.
          if [ "$PLAN" != success ]; then
            echo "planning failed — no mutation coverage was decided" >&2
            exit 1
          fi
          for result in "$ALLOWLIST" "$DIFF"; do
            case "$result" in
              success|skipped) ;;
              *) echo "a mutation job reported '$result'" >&2; exit 1 ;;
            esac
          done
          echo "every applicable mutation slice passed"
