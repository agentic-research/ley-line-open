name: Mutation testing

# Checks the TESTS, not the code: rewrites the source in small ways and fails
# if the suite still passes. It catches the class of defect a correctness test
# structurally cannot — e.g. widening the chunk-overlap predicate, which
# returns identical bytes while fetching chunks it never needed.
#
# Path-filtered and separate from `ci.yml` because it takes ~17 min. Same
# taskfile-ci-parity rule as everything else: this workflow invokes
# `task mutants`, it does not re-implement the command.
# Broadened to all Rust (`ley-line-open-085dff`). Previously this fired only on
# the allowlist paths, so a PR touching `partition.rs` or the schema-bridge
# emitters — the two places that produced silent wrong-output bugs this week —
# got no mutation coverage at all.
#
# Broadening is affordable only because the diff-scoped run costs time
# proportional to the DIFF rather than the codebase. The expensive allowlist run
# stays conditional on the allowlist actually being touched; see the step guard
# below. Without that guard this would add ~17 min to every Rust PR, and a gate
# people route around has already failed.
#
# Also tiered by TARGET (`ley-line-open-804f7e`): the allowlist run only fires
# on integration -> main PRs, never on feature -> integration PRs, mirroring
# ci.yml's existing base_ref tiering rather than inventing a second axis.
# A feature PR still gets `mutants:diff`, scoped to its own diff; the
# allowlist's full-module sweep runs once, at the promotion gate, where the
# diff against main naturally accumulates everything a release bundles.
on:
  pull_request:
    branches: [main, integration]
    paths:
      - 'rs/**'
      - 'Taskfile.yml'
      - '.github/workflows/mutants.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    # Named for WHAT IT COVERS, not for the command it runs. It previously read
    # `cargo mutants (task mutants)`, which on a PR touching both Taskfile.yml
    # and unrelated source rendered as an unqualified green — a reader
    # reasonably concluded the PR's new logic survived mutation testing, when
    # the run had covered the CDC allowlist and nothing the PR changed
    # (`ley-line-open-085dff`).
    name: cargo mutants (allowlist + this PR's diff)
    runs-on: ubuntu-latest
    # Same reasoning as ci.yml. This job legitimately runs longer — the
    # allowlist arm is ~17 min by its own accounting above, and a diff arm has
    # been seen at 14 min — so the ceiling is higher, but a ceiling still beats
    # the 6-hour default when a mutant build wedges.
    #
    # Raised 60 -> 90 on the projection-v5 PR, which hit the old ceiling at
    # 60m44s with the fs slice still unrun. Both slices that DID run were
    # clean (generic 188 in 6m, cli-lib 106 in 49m, zero missed either side),
    # so this was the guard firing on run LENGTH, not on a survivor. Two
    # things drove it, one transient and one permanent:
    #
    #   * transient — the diff arm scales with how many functions the diff
    #     touches, and a workspace-wide re-key touches hundreds. 106 cli-lib
    #     mutants against the ~14-min arm this ceiling was sized for.
    #   * permanent — the cli-lib slice now builds `--features vec`, without
    #     which `daemon/embed.rs` compiles out and its mutants are reported
    #     MISSED having tested nothing (see tools/mutants_diff.sh). That is
    #     real coverage the gate previously did not have, and it costs roughly
    #     18s -> 28s per mutant in build time.
    #
    # 90 leaves headroom for the fs slice (~10 min) plus runner variance. If a
    # future diff arm approaches this too, the fix is to parallelise the three
    # slices into a matrix rather than to keep lifting the ceiling — they are
    # independent, and `mutants_diff.sh` already takes a scope argument.
    timeout-minutes: 90
    steps:
      # SHA-pinned: actions/checkout@v6.0.2 (Node 24)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # The diff-scoped run needs the merge base, which a depth-1 checkout
          # does not have. Without this, the diff comes out empty and
          # `mutants:diff` reports SKIPPED — green, having tested nothing.
          fetch-depth: 0
      # SHA-pinned: dtolnay/rust-toolchain. Same nightly pin as ci.yml
      # (bead ley-line-open-75444d) so a mutant run can't fail for a
      # toolchain reason CI wouldn't also hit.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1  # must equal rust-toolchain.toml (task lint:toolchain-parity)

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          workspaces: rs

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          # Exact, not `3.x`: a floating minor means the runner can pick up a
          # new go-task whose behaviour differs from the one developers have,
          # which is the same class of drift rust-toolchain.toml exists to
          # close. Bump deliberately, together with local installs.
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # System deps (libfuse for fuser, capnproto + libcapnp-dev for schema
      # build.rs, libdbus-1-dev for keyring) live in Taskfile deps:ci —
      # single source across ci.yml/release.yml/release-dryrun.yml/
      # leyline-schema-go.yml/mutants.yml, enforced by
      # `task lint:workflow-parity` (bead ley-line-open-e9e5b5). Without this
      # the diff-scoped BASELINE build fails on any diff touching leyline-fs:
      # the scratch build compiles fuser, and the runner never installed
      # libfuse.
      - name: Install system deps
        run: task deps:ci

      # Installed from source rather than via a prebuilt-binary action: every
      # other action here is SHA-pinned against a commit verified in-repo, and
      # adding an unvetted third-party action to save ~2 min isn't a trade this
      # repo makes. --locked so the build can't drift with a transitive bump.
      # Single-sourced in Taskfile deps:cargo-mutants (bead ley-line-open-2bea72).
      - name: Install cargo-mutants
        run: task deps:cargo-mutants

      # Which of the two runs are warranted for THIS PR. Computed from the diff
      # rather than from a paths filter, because the workflow-level filter is
      # now deliberately broad and the two runs answer different questions.
      - name: Decide which runs apply
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          # The allowlist run is ~17 min (measured 2026-08-05; the three "~7
          # min" figures this file reasoned from were 2.4x low, so the guard
          # was more load-bearing than its own comments claimed). It fires
          # only when the modules it
          # covers changed, OR when the task definitions themselves changed —
          # editing `mutants:*` should re-verify the gate still runs, which is
          # the reason Taskfile.yml is a trigger at all.
          #
          # tools/mutants_diff.sh is in this list for exactly that reason: the
          # gate's logic MOVED there, out of the Taskfile, so shellcheck could
          # read it. Leaving it out meant a change to the gate itself no longer
          # re-verified the gate — the trigger kept pointing at the file the
          # logic used to live in.
          # `cdc/` is matched as its RUST SOURCES, not as a directory prefix.
          # Written bare it also matched `rs/ll-open/cdc/Cargo.toml`, so every
          # release fired the 17-minute allowlist run: a version bump touches
          # 20 manifests, one of them cdc's. Measured on chore/release-0.17.0,
          # where the same job reported `task mutants (allowlist) 17m` beside
          # `task mutants:diff (this PR) — nothing to mutate`. Seventeen
          # minutes covering nothing the PR changed, on the one hop that is
          # actually on the release critical path (vigil, `ley-line-open-f951a9`).
          #
          # This removes no coverage. The other three entries are already exact
          # `.rs` paths, so a change to `fs/Cargo.toml` or `core/Cargo.toml`
          # has never triggered them either — the fix makes cdc consistent with
          # the rest rather than carving an exception. What a manifest-only
          # change to cdc still gets is `mutants:diff`, which covers whatever
          # the PR actually touched.
          # Tiered by target, same axis ci.yml already tiers `task ci` on
          # (`github.base_ref`) — not by a separate concept. A feature PR
          # lands on `integration` constantly; the allowlist's own 17 minutes
          # is the cost of running it on every one of those, for coverage that
          # `mutants:diff` already gives per-PR and the promotion gate gives
          # again, accumulated, before anything reaches `main`. Reserving it
          # for `integration` -> `main` PRs means it still runs before every
          # release — main's own diff against `integration` naturally spans
          # everything a promotion bundles — while dev flow on `integration`
          # keeps just the diff-scoped run.
          #
          # Traded away deliberately, not accidentally: a feature PR that
          # introduces a real survivor in an allowlisted module won't see it
          # until the PROMOTION PR, which usually bundles several feature
          # PRs — worse attribution than catching it at the PR that caused
          # it. Accepted for now because the alternative (paying 17 minutes
          # on every feature PR) was the thing making dev flow painful; if
          # attribution turns out to matter more than the wait, this is the
          # line to revert.
          if [ "$BASE_REF" = "main" ] && printf '%s\n' "$changed" | grep -qE \
            '^(rs/ll-open/cdc/.*\.rs$|rs/ll-open/fs/src/(chunked|gc)\.rs|rs/ll-core/core/src/partition\.rs|Taskfile\.yml|tools/mutants_diff\.sh|\.github/workflows/mutants\.yml)'; then
            echo "allowlist=true" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_REF" != "main" ]; then
            echo "allowlist=false" >> "$GITHUB_OUTPUT"
            echo "::notice::allowlist run skipped — reserved for integration -> main promotions (ley-line-open-804f7e)"
          else
            echo "allowlist=false" >> "$GITHUB_OUTPUT"
            echo "::notice::allowlist run skipped — this PR touches none of the covered modules"
          fi

      # Full coverage of the modules carrying falsifiable claims. Answers "do
      # the tests for THOSE modules still bite?"
      - name: task mutants (allowlist)
        if: steps.scope.outputs.allowlist == 'true'
        run: task mutants

      # The diff: coverage of what THIS PR changed. Answers the question the
      # allowlist cannot, and costs time proportional to the diff rather than
      # to the codebase (a whole-workspace run enumerates 5806 mutants).
      #
      # `--relative=rs` is load-bearing. cargo-mutants runs in `rs/`, so the
      # diff's paths must be workspace-relative (`a/ll-core/...`). A diff made
      # from the repo root carries `a/rs/ll-core/...`, matches nothing, prints
      # "No mutants to filter" and EXITS 0 — a permanently green check that
      # tests nothing, from a path prefix. `task mutants:diff` detects that
      # case and fails rather than passing; this line is what keeps it from
      # having to.
      - name: Generate workspace-relative diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git diff --relative=rs "$BASE_SHA...$HEAD_SHA" -- rs/ > /tmp/pr.diff
          wc -l < /tmp/pr.diff

      - name: task mutants:diff (this PR)
        run: task mutants:diff DIFF=/tmp/pr.diff

      # The report says which mutants survived and where — far more useful
      # than the exit code when this job goes red.
      - name: Upload mutants report
        if: always()
        # SHA-pinned: actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-report
          path: rs/mutants.out/
          if-no-files-found: ignore
