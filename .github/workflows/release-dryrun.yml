name: Release dry-run

# The release path used to run ONLY on a `v*` tag, so a tag was the first time
# any of it executed. v0.12.0 proved the cost: the image jobs failed on a
# permanent tag, and the cause (`cargo install krust` resolving to an unrelated
# crates.io package) was something a single PR run would have caught.
#
# This job builds and stages exactly what release.yml does, and publishes
# NOTHING. Separate workflow rather than a `pull_request:` trigger on
# release.yml, so the credentialed publish and attest jobs cannot fire on a PR
# by accident — a paths filter is not a permission boundary.
#
# Paths-filtered because a 4-target matrix on every docs change is the kind of
# tax that makes people stop reading CI.
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dryrun.yml'
      - 'Taskfile.yml'
      - 'image.Dockerfile'
      - 'tools/stage_release_artifacts.sh'
      - 'tools/test_execution_schema_asset.sh'
      - 'tools/cli_smoke.sh'
      - 'rs/ll-open/cli-lib/Taskfile.yml'
      - 'tools/prepare_public_release.sh'
      - 'tools/verify_public_release.sh'
      - 'tools/release-assets.txt'
      - 'tools/release-version-manifests.txt'
      - 'tools/crate-publish-order.txt'
      - 'tools/verify_crate_publish_order.sh'
      - 'tools/test_crate_publish_order.sh'
      - 'rs/ll-core/schema-spec/**'
      - 'rs/ll-core/public-schema/**'
      - 'rs/ll-open/schema-bridge/**'
      - 'rs/ll-core/mcp-descriptor/**'
      - 'rs/ll-open/cli/**'
      # The macOS microVM worker asset (ley-line-open-984acf).
      - 'rs/ll-open/krun-worker/**'
      - 'tools/sign_krun_worker.sh'
      - 'entitlements.plist'
      # The crates behind the published wasm artifacts (ley-line-open-a2099a,
      # ley-line-open-be5f86).
      - 'rs/ll-open/sign/**'
      - 'rs/ll-open/cas-ffi/**'
      - 'rs/ll-open/envelope/**'

# Read-only at the workflow level and never escalated. This job has no reason
# to hold a registry credential, a release token, or an OIDC identity — it
# proves things BUILD, and anything it could publish would be from unreviewed
# PR code.
permissions:
  contents: read

concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: build + stage (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          cache-targets: false

      # Same Taskfile deps:capnp target ci.yml and release.yml call. Omitting
      # this install is what made this workflow fail its own first run:
      #
      #   capnp codegen failed (is `capnp` on PATH?)
      #
      # `leyline-schema-capnp`'s build script shells out to the capnp compiler,
      # and libcapnp-dev (not the capnproto package alone) ships the standard
      # schema includes that `import "/capnp/c++.capnp"` resolves against.
      - name: Install system deps
        run: task deps:capnp

      - name: Verify schema crate package order
        run: task release:crates:check

      # One target, not the full matrix. The failures this guards against are
      # in the SHARED logic — the staging contract, the asserted asset set, the
      # generator build — not in per-arch differences, which the tag run still
      # covers. One target keeps a PR check honest without making it expensive.
      - name: Build CLI
        env:
          BUILD_TARGET: x86_64-unknown-linux-gnu
        run: task release:target

      - name: Smoke the built binary
        run: task cli-lib:smoke:bin BIN=rs/target/x86_64-unknown-linux-gnu/release/leyline

      - name: Build generator binaries
        env:
          BUILD_TARGET: x86_64-unknown-linux-gnu
        run: task release:generators:target

      # Same wasm set release.yml's linux-amd64 job builds and stages —
      # the whole point of this workflow is that the release path gets
      # rehearsed, and the wasm slot is single-uploader, so this is the
      # only job shape that ever exercises it (ley-line-open-a2099a,
      # ley-line-open-be5f86).
      - name: Install wasm32 target
        run: task deps:wasm32

      - name: Build wasm artifacts
        run: |
          task sign:wasm:build
          task cas-ffi:wasm:build
          task envelope:wasm:build

      # The step that caught a real incompleteness while it was being written:
      # release-assets.txt asserted 28 names while staging produced 8, and
      # prepare_public_release diffed them and failed. Exercising staging on a
      # PR is what turns that from a tag-time surprise into a review comment.
      - name: Stage artifacts
        env:
          BUILD_TARGET: x86_64-unknown-linux-gnu
          ASSET_NAME: leyline-linux-amd64
          GENERATOR_BINS: >-
            capnpc-schema-bridge-zod
            capnpc-schema-bridge-go
            capnpc-schema-bridge-jsonschema
            capnpc-schema-bridge-tooldefs
            leyline-mcp-descriptor
          WASM_ASSETS: leyline_sign.wasm leyline_cas_ffi.wasm leyline_envelope.wasm
          # Same flag release.yml's linux-amd64 leg sets: the execution/v1
          # tooldefs and the schema bytes they come from (6bb789, 6d811a).
          INCLUDE_TOOLDEFS: "true"
        run: task release:artifacts:stage

      # What a consumer without an LLO checkout does with the schema assets:
      # lay them out, compile with the STAGED zod plugin, get the three
      # execution/v1 structs (ley-line-open-6d811a).
      - name: Compile the staged execution/v1 schema standalone
        run: >-
          tools/test_execution_schema_asset.sh .artifacts/staged/leyline-linux-amd64
          .artifacts/staged/leyline-linux-amd64/capnpc-schema-bridge-zod-linux-amd64

      - name: Verify staged wasm export surface
        run: |
          task sign:wasm:verify WASM_ARTIFACT="$PWD/.artifacts/staged/leyline-linux-amd64/leyline_sign.wasm"
          task cas-ffi:wasm:verify WASM_ARTIFACT="$PWD/.artifacts/staged/leyline-linux-amd64/leyline_cas_ffi.wasm"
          task envelope:wasm:verify WASM_ARTIFACT="$PWD/.artifacts/staged/leyline-linux-amd64/leyline_envelope.wasm"

      - name: Assert the staged set matches what the release asserts
        run: |
          set -eu
          staged=$(find .artifacts/staged/leyline-linux-amd64 -maxdepth 1 -type f \
            ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort)
          # Every asset release-assets.txt names for THIS target must be present.
          # Grepping the asserted set rather than hardcoding names here keeps
          # one source of truth; a second list would be free to disagree.
          missing=0
          while IFS= read -r want; do
            # This job stages the linux-amd64 set plus the platform-independent
            # wasm and execution/v1 artifacts, so all three shapes are
            # asserted here.
            case "$want" in
              *-linux-amd64 | *.wasm | execution.* | traits.capnp) ;;
              *) continue ;;
            esac
            printf '%s\n' "$staged" | grep -qx "$want" || {
              echo "::error::release-assets.txt names '$want' but staging did not produce it"
              missing=1
            }
          done < tools/release-assets.txt
          test "$missing" = 0 || exit 1
          printf '%s\n' "$staged" | sed 's/^/staged: /'

  image:
    name: build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1

      # Same Taskfile deps:capnp target as the stage job — the image build
      # compiles the same workspace and hits the same capnp build script.
      - name: Install system deps
        run: task deps:capnp

      # The exact step that failed on the v0.12.0 tag. It ran `cargo install
      # krust --locked`, where the local krust was a /tmp path install and the
      # crates.io `krust` is an unrelated 2016 Vulkan wrapper. Running this on
      # a PR is the whole point of this workflow. Same deps:zig target
      # release.yml's image job calls (bead ley-line-open-2bea72).
      - name: Install zig toolchain
        run: task deps:zig RUST_TARGET=x86_64-unknown-linux-musl

      # `task image` builds and tags locally. No `docker login`, no push — the
      # job holds no registry credential, so it could not push if it tried.
      - name: Build image
        run: task image PLATFORM=linux/amd64

      - name: Assert the image exists and carries the derived tag
        run: |
          set -eu
          VERSION=$(grep -m1 '^version = ' rs/ll-open/cli/Cargo.toml | cut -d'"' -f2)
          REF="localhost/leyline:v${VERSION}"
          docker image inspect "$REF" >/dev/null
          echo "built $REF"

  # release.yml's darwin-arm64 leg builds leyline-krun-worker, and staging
  # signs it with com.apple.security.hypervisor and checks the staged copy
  # (ley-line-open-984acf). That leg needs macOS codesign and zig for the
  # guest init, neither of which the Linux stage job above exercises, so
  # without this job the tag would be the first run of either.
  krun-worker:
    name: build + sign + stage krun worker (macOS, no publish)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          workspaces: rs
          cache-targets: false

      - name: Install system deps
        run: task deps:capnp

      - name: Install krun guest-init compiler
        run: task deps:krun-init-cc

      - name: Build leyline-krun-worker
        env:
          BUILD_TARGET: aarch64-apple-darwin
        run: task krun-worker:release:target

      # The worker stands in for the CLI here: this job proves the worker
      # leg of staging, and the stage job above proves the CLI's.
      - name: Stage the worker as release.yml does
        env:
          BUILD_TARGET: aarch64-apple-darwin
          ASSET_NAME: leyline-darwin-arm64
          CLI_SOURCE: ${{ github.workspace }}/rs/target/aarch64-apple-darwin/release/leyline-krun-worker
          KRUN_WORKER_ASSET: leyline-krun-worker-darwin-arm64
        run: task release:artifacts:stage

      - name: Assert the staged worker carries the hypervisor entitlement
        run: |
          set -eu
          staged=.artifacts/staged/leyline-darwin-arm64
          tools/sign_krun_worker.sh --check "$staged/leyline-krun-worker-darwin-arm64"
          grep -q '  leyline-krun-worker-darwin-arm64$' "$staged/SHA256SUMS"
          codesign -d --entitlements - "$staged/leyline-krun-worker-darwin-arm64"
