name: Release
on:
  push:
    tags: ['v*']

# Builds the `leyline` daemon binary for the 4 platforms mache's
# auto-downloader probes (`internal/leyline/socket.go::downloadLeyline`
# fetches `leyline-{GOOS}-{GOARCH}` from `/releases/latest/download/`),
# then attaches them as assets on the tag's GitHub release.
#
# Matrix uses native runners per target — no cross-compile complexity
# (krust is fine for the OCI image build because it produces musl
# binaries for the runtime, but cross-compiling macOS from Linux is a
# notarization-adjacent rabbit hole we don't need here).
#
# Default features (`lsp`, `validate`, `hdc`, `cdc`) are built. The `mount`
# (FUSE) feature is gated off so the release binary doesn't depend on libfuse
# at the consumer end — mache uses the daemon for MCP/UDS, not for mounting.
#
# Security posture:
# - No third-party actions for release management (built-in `gh` CLI)
# - Per-job `permissions:` scoping (default workflow permissions stay
#   read-only)
# - `persist-credentials: false` on checkout so the build job can't
#   accidentally push back
# - All matrix values flow into `env:` blocks, never interpolated
#   directly into `run:` shell

# Workflow-level permissions stay at the read-only default. Each job
# below escalates only the permissions it actually needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  SCCACHE_CACHE_SIZE: 2G

# Serialize tag releases — two simultaneous tag pushes would race on
# the same GitHub release object (asset uploads overwrite each other).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: leyline-linux-amd64
            # lib_asset present → this job also builds + uploads the
            # libleyline_fs FFI staticlib that mache's release links.
            lib_asset: libleyline_fs-linux-amd64.a
            # Upload the C header from exactly one job (avoids 3-way
            # --clobber races on the same asset).
            include_header: true
            # wasm_assets present → this job also builds + stages the
            # platform-independent wasm32 artifacts (ley-line-open-a2099a;
            # envelope joined under ley-line-open-be5f86). One artifact each
            # for every platform, so exactly one job carries them — same
            # single-uploader rule as the header.
            wasm_assets: leyline_sign.wasm leyline_cas_ffi.wasm leyline_envelope.wasm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: leyline-linux-arm64
            lib_asset: libleyline_fs-linux-arm64.a
          # darwin-amd64 cross-compiled from macos-latest (arm64) instead
          # of macos-13. The macos-13 hosted runner pool is heavily
          # oversubscribed — both v0.4.0 and v0.4.1 saw this job sit in
          # `queued` indefinitely (never executed), leaving us with 3-of-4
          # binaries per release. Apple's clang on arm64 macOS handles
          # x86_64-apple-darwin cross-compilation natively; the existing
          # `targets: ${{ matrix.target }}` line on the toolchain step
          # already installs the cross target. Tracked by bead
          # `ley-line-open-392bd7`.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: leyline-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: leyline-darwin-arm64
            lib_asset: libleyline_fs-darwin-arm64.a
    steps:
      # SHA-pinned: actions/checkout@v6.0.2 (matches ci.yml).
      # `persist-credentials: false` so the GITHUB_TOKEN written by
      # checkout into the local git config can't be used by later
      # steps to push back. Build jobs have no release write permission.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # SHA-pinned: dtolnay/rust-toolchain (composite action — Node
      # version deprecation does not apply).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          # Pinned per bead `ley-line-open-75444d` — keep in sync with
          # ci.yml. Unpin when the rustc ICE on `#[serial(<key>)]`
          # (daf2e5e18 2026-07-13) rolls out.
          toolchain: 1.97.1  # must equal rust-toolchain.toml (task lint:toolchain-parity)
          targets: ${{ matrix.target }}

      # Cargo registry/git inputs only. Compiler outputs are handled by the
      # Taskfile-managed sccache below; duplicating target/ made the old cache
      # both large and ineffective against final-link failures.
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          workspaces: rs
          cache-targets: false

      # Exact Taskfile version used by local development and ci.yml.
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # capnproto + libcapnp-dev/capnp + pkg-config, single-sourced in
      # Taskfile deps:capnp — same target ci.yml, release-dryrun.yml, and
      # leyline-schema-go.yml call (bead ley-line-open-2bea72).
      - name: Install system deps
        run: task deps:capnp

      # Cargo requires a registry dependency to exist before packaging its
      # consumer. The linux-amd64 leg proves schema-spec is a complete first
      # package and appears before public-schema in the release graph; no
      # registry credential is needed for this check.
      - name: Verify schema crate package order
        if: matrix.asset == 'leyline-linux-amd64'
        run: task release:crates:check

      # SHA-pinned: actions/cache@v6.1.0 (Node 24).
      - name: Restore target compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust-1.97.1-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust-1.97.1-

      - name: Install pinned sccache through Taskfile
        run: task cache:sccache:install

      - name: Reset sccache statistics
        run: task cache:sccache:zero

      - name: Build leyline (release, default features)
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: task release:target

      # ---- FFI staticlib (consumed by mache's release build) ----
      # mache links `libleyline_fs-<os>-<arch>.a` + `leyline_fs.h` to build
      # its NFS-backed binaries (mache-55d3e1 / ley-line-open-c33b9a). Built
      # with leyline-fs defaults (validate, fuse, nfs) plus explicit `cdc`, so
      # mache's cgo reads use the same materialize-on-read path validated by
      # this release. Only the 3 platforms in mache's release matrix carry
      # `lib_asset`; darwin-amd64 is skipped.
      - name: Install FUSE deps (staticlib only)
        if: matrix.lib_asset
        run: task deps:fuse

      - name: Build leyline-fs staticlib
        if: matrix.lib_asset
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: task release:fs-static:target

      # The generators downstream repos RUN: capnp resolves `-o<plugin>` by
      # PATH-searching `capnpc-<plugin>`, so cloister's `task cluster:zod` and
      # rosary's tooldefs path need these as binaries. Unpublished until now,
      # which is why v0.11.3 could ship the 8c00c6 zod fix while cloister still
      # had to SHA-pin a git dep and build it from source (ley-line-open-e44960).
      # Built on every target — pure Rust, no C dependency, unlike the staticlib.
      - name: Build generator binaries
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: task release:generators:target

      # ---- wasm32 artifacts (ley-line-open-a2099a, ley-line-open-be5f86) ----
      # leyline-sign builds with root-signer ON / host OFF, cas-ffi with its
      # default (only) surface, and envelope with its default surface (whose
      # manifest keeps the export set verification-only) — the feature pins
      # live in the crate Taskfiles and manifests, not here. The rustup
      # target install is single-sourced in `task deps:wasm32` (task
      # lint:workflow-parity's rule: workflows invoke deps targets, they
      # never inline installs).
      - name: Install wasm32 target
        if: matrix.wasm_assets
        run: task deps:wasm32

      - name: Build wasm artifacts
        if: matrix.wasm_assets
        run: |
          task sign:wasm:build
          task cas-ffi:wasm:build
          task envelope:wasm:build

      - name: Stage exact build outputs and checksum manifest
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ matrix.asset }}
          LIB_ASSET: ${{ matrix.lib_asset }}
          INCLUDE_HEADER: ${{ matrix.include_header }}
          # Staged as `<bin>-<suffix>`; the suffix derives from ASSET_NAME.
          # tools/release-assets.txt asserts the resulting 20 names, so a
          # binary that fails to build fails the release rather than silently
          # shipping a smaller asset set.
          GENERATOR_BINS: >-
            capnpc-schema-bridge-zod
            capnpc-schema-bridge-go
            capnpc-schema-bridge-jsonschema
            capnpc-schema-bridge-tooldefs
            leyline-mcp-descriptor
          WASM_ASSETS: ${{ matrix.wasm_assets }}
        run: task release:artifacts:stage

      # Against the STAGED bytes, not the build output — what this proves is
      # that the files entering the SHA256SUMS chain export the surface
      # consumers bind by name (a real wasmparser parse of the export
      # section; see rs/ll-open/sign/tests/wasm_export_surface.rs).
      - name: Verify staged wasm export surface
        if: matrix.wasm_assets
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          task sign:wasm:verify WASM_ARTIFACT="$PWD/.artifacts/staged/$ASSET_NAME/leyline_sign.wasm"
          task cas-ffi:wasm:verify WASM_ARTIFACT="$PWD/.artifacts/staged/$ASSET_NAME/leyline_cas_ffi.wasm"
          task envelope:wasm:verify WASM_ARTIFACT="$PWD/.artifacts/staged/$ASSET_NAME/leyline_envelope.wasm"

      # SHA-pinned: actions/upload-artifact@v7.0.1 (Node 24). Build jobs only
      # write workflow artifacts; they never receive release write permission.
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.asset }}
          path: .artifacts/staged/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Report sccache statistics
        if: always()
        run: task cache:sccache:stats

  publish:
    name: Verify and publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # SHA-pinned: actions/download-artifact@v8.0.1 (Node 24). GitHub also
      # validates the service-provided artifact digest during download; the
      # committed verifier below checks our per-file manifests and uniqueness.
      - name: Download all target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: .artifacts/downloaded

      - name: Prepare aggregate verified publication set
        env:
          ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/downloaded
          PUBLICATION_DIR: ${{ github.workspace }}/.artifacts/publication
        run: task release:artifacts:prepare

      - name: Upload verified bytes to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PUBLICATION_DIR: ${{ github.workspace }}/.artifacts/publication
        run: task release:artifacts:publish

      - name: Verify public assets and schema module
        env:
          TAG: ${{ github.ref_name }}
        run: task release:verify-public VERSION="${TAG#v}"

  # ---------------------------------------------------------------------------
  # OCI image (`ley-line-open-e44960`)
  #
  # server.json has advertised `ghcr.io/agentic-research/ley-line-open` since
  # v0.8.0 and nothing ever pushed it. That is worse than it sounds: cloister
  # derives `<identifier>:<version>` (ADR-0038) and, when the address does not
  # resolve, does NOT fail — it warns "could not resolve an OCI digest, pinning
  # by MUTABLE TAG" and proceeds. v0.11.3 corrected the address SHAPE and so
  # converted a loud resolve failure into a warning that flows through.
  #
  # Build logic lives in the Taskfile (`task image:publish`), not here. This
  # job supplies only what is intrinsically CI's: the registry credential, the
  # tag, and the build-provenance attestation — which cannot move into the
  # Taskfile because its entire value is the runner's OIDC identity. A locally
  # generated attestation attests nothing.
  # ---------------------------------------------------------------------------
  image:
    name: build+push image ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per arch — same reasoning as the binary matrix
          # above. zigbuild cross-compiles, but building each arch on its own
          # runner keeps the musl toolchain path identical to local.
          #
          # rust_target must agree with the triple `task image` derives from
          # PLATFORM; the build fails loudly on a mismatch (missing binary at
          # the BIN_PATH docker COPYs) rather than shipping the wrong arch.
          - platform: linux/amd64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.97.1

      # `task image` runs `cargo zigbuild` to produce the static musl binary
      # image.Dockerfile COPYs onto chainguard/static. The release matrix builds
      # *gnu* targets, which would not run on a distroless base — so this is a
      # separate build, not a reuse of those artifacts.
      #
      # This previously also ran `cargo install krust --locked`, which is why
      # the v0.12.0 image jobs failed and could never have succeeded: the krust
      # this repo used was a LOCAL PATH install (`/tmp/krust`), while the
      # `krust` on crates.io is an unrelated abandoned 2016 Vulkan bindings
      # wrapper. The step either failed or installed a stranger's crate on a
      # name collision. Installing by bare name does not belong in a release
      # path (`ley-line-open-e44960`).
      # The `build` job above installs these; this job did not, and that is why
      # the image failed on v0.12.1 — `leyline-schema-capnp`'s build script
      # shells out to the capnp compiler, and libcapnp-dev (not the capnproto
      # package alone) ships the standard schema includes that
      # `import "/capnp/c++.capnp"` resolves against.
      #
      # release-dryrun.yml caught exactly this on a branch and I fixed it THERE
      # only, shipping the same bug here. The dry-run told the truth; the answer
      # went into the wrong file. Both jobs now call the same Taskfile
      # deps:capnp target — `task lint:workflow-parity` fails the build if
      # either release-pair file's install-Rust job doesn't call it
      # (bead ley-line-open-2bea72).
      - name: Install system deps
        run: task deps:capnp

      # musl, not gnu: chainguard/static carries no glibc. RUST_TARGET is a
      # required task var, not an env passthrough — deps:zig has no safe
      # default to guess.
      - name: Install zig toolchain
        run: task deps:zig RUST_TARGET="${{ matrix.rust_target }}"

      - name: Log in to ghcr
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TAG is `v`-prefixed deliberately. ADR-0041 says `version` must match
      # the git tag; the load-bearing invariant is that it must match the
      # PUSHED IMAGE TAG, because that is what makes `<identifier>:<version>`
      # resolve. LLO emits `v0.11.3` in server.json, so the pushed tag must
      # carry the `v`. `task image:publish` refuses a mismatch rather than
      # trusting this line.
      - name: Build and push
        env:
          TAG: ${{ github.ref_name }}
        run: task image:publish TAG="$TAG" PLATFORM="${{ matrix.platform }}"

  image-manifest:
    name: Publish multi-arch manifest and attest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by attest-build-provenance: it signs with the runner's
      # short-lived OIDC identity and records the attestation against the
      # repository. This is the supply-chain property cloister asked for —
      # it turns "pinning by mutable tag" into a verifiable digest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ghcr
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `<identifier>:<version>` must resolve to the manifest list, not to a
      # single architecture — cloister derives exactly that address.
      - name: Assemble manifest list
        env:
          TAG: ${{ github.ref_name }}
        run: task image:manifest TAG="$TAG"

      - name: Resolve pushed digest
        id: digest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          REF="ghcr.io/agentic-research/ley-line-open"
          # Plain Go template. Actions expands only dollar-brace-brace
          # expressions, so these single braces reach docker untouched.
          # (Writing that sigil literally here would itself be parsed as an
          # expression — actionlint rejects it even inside a shell comment.)
          DIGEST=$(docker buildx imagetools inspect "${REF}:${TAG}" \
            --format '{{.Manifest.Digest}}')
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "resolved ${REF}:${TAG} -> $DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/agentic-research/ley-line-open
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # The gate that makes this job meaningful: reads the address out of the
      # COMMITTED server.json and proves it resolves. Schema validation
      # (ley-line-open-891dd5) proves the address is well-formed; only this
      # proves it is pullable. v0.11.3 shipped well-formed and unpullable.
      - name: Verify the advertised address resolves
        run: task image:verify-published
