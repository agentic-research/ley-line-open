# Self-contained validation wiring (taskfile-ci-parity).
#
# The commit hook runs a Taskfile target, as CI does (ci.yml: `run: task
# ci`), so neither this file nor CI re-implements the underlying commands.
#
# Install once (does NOT touch the rsry-managed commit-msg/post-merge/
# post-push hooks — pre-commit owns pre-commit only):
#
#   pre-commit install --hook-type pre-commit
#
# There is no pre-push gate. A client hook is skipped whenever the repo's
# core.hooksPath points elsewhere (the rsry hooks dir does), so it cannot
# guard a branch. Work lands on integration through `task land:integration`,
# which refuses a dirty tree, a branch that does not contain integration,
# and a tree with no `task ci` receipt (bead ley-line-open-3a6beb).
repos:
  - repo: local
    hooks:
      # Fast feedback at commit time. Taskfile remains the source of truth:
      # staged whitespace, Rust formatting, and cargo check are composed by
      # check:commit rather than duplicated in this hook.
      - id: task-check-commit
        name: task check:commit (staged diff + fmt + type-check)
        entry: task check:commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
