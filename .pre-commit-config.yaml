# Self-contained validation wiring (taskfile-ci-parity).
#
# The pre-push hook runs `task ci` — the SAME gate CI runs (ci.yml:
# `run: task ci`) — so "passes locally" and "passes CI" cannot disagree:
# they invoke one definition. Neither this file nor CI re-implements the
# underlying commands; both point at Taskfile targets.
#
# Install once (does NOT touch the rsry-managed commit-msg/post-merge/
# post-push hooks — pre-commit owns pre-commit + pre-push only):
#
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# After that you never run check/clippy/fmt/blake3-lint by hand: `git commit`
# runs the Taskfile's fast commit gate, `git push` runs the full gate and
# blocks a push CI would reject.
repos:
  - repo: local
    hooks:
      # Fast feedback at commit time. Taskfile remains the source of truth:
      # staged whitespace, Rust formatting, and cargo check are composed by
      # check:commit rather than duplicated in this hook.
      - id: task-check-commit
        name: task check:commit (staged diff + fmt + type-check)
        entry: task check:commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Reuse a successful task-ci receipt only when it addresses the exact
      # committed tree and toolchain. Otherwise run the same full gate as CI.
      - id: task-ci
        name: task ci (exact-tree receipt or full gate)
        # `env -u GIT_DIR -u GIT_INDEX_FILE` is load-bearing for the 1:1 claim.
        # git exports GIT_DIR (and GIT_INDEX_FILE) into hook processes, and it
        # is inherited all the way down into test subprocesses. Tests that shell
        # out to git in a tempdir (cli-lib's `cmd_daemon` git_* / watcher_*
        # tests) then operate on THIS repo instead: `git init -q` fails and
        # `git_head(tempdir)` returns this repo's HEAD. Result: 7 tests fail at
        # push time and pass in CI — exactly the local/CI disagreement this
        # file exists to prevent. CI has no GIT_DIR, so unsetting it here is
        # what makes the two environments equal.
        entry: env -u GIT_DIR -u GIT_INDEX_FILE tools/pre_push_ci.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
