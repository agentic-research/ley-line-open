version: '3'

# Golden path: CI and local dev both use these tasks.
# Workflows (.github/workflows/) should call `task <name>`, never raw cargo.

# Crate-scoped tasks live beside the crate they exercise; this file keeps only
# repo-wide orchestration. Included tasks are namespaced by their key, so
# `cli-lib:test:vec` runs the `test:vec` task in rs/ll-open/cli-lib/Taskfile.yml.
#
# `tools/check_feature_reachability.sh` discovers ci-invoked `cargo test
# --features` lines via `task --summary`, which follows these includes. It does
# not parse Taskfiles textually (ed356d7) — that was changed FIRST, precisely so
# moving a task out of this file could not silently drop its feature coverage.
includes:
  cas-ffi:
    taskfile: rs/ll-open/cas-ffi/Taskfile.yml
  cli-lib:
    taskfile: rs/ll-open/cli-lib/Taskfile.yml
  envelope:
    taskfile: rs/ll-open/envelope/Taskfile.yml
  fs:
    taskfile: rs/ll-open/fs/Taskfile.yml
  rs:
    taskfile: rs/Taskfile.yml
  runtime:
    taskfile: rs/ll-open/runtime/Taskfile.yml
  sign:
    taskfile: rs/ll-open/sign/Taskfile.yml

vars:
  SCCACHE_VERSION: 0.15.0
  SCCACHE_BIN: '{{.ROOT_DIR}}/.tools/bin/sccache'
  # macOS needs our fuse-t pkg-config wrapper; Linux uses system libfuse3.
  FUSE_PKG_CONFIG_PATH:
    sh: 'if [ "$(uname)" = "Darwin" ]; then echo "{{.ROOT_DIR}}/rs/pkgconfig"; fi'

env:
  PKG_CONFIG_PATH: '{{.FUSE_PKG_CONFIG_PATH}}'
  # Prefer the Taskfile-pinned binary installed by cache:sccache:install.
  # Standalone tasks retain the old optional-system-sccache behavior.
  RUSTC_WRAPPER:
    sh: 'if [ -x "{{.SCCACHE_BIN}}" ]; then echo "{{.SCCACHE_BIN}}"; else command -v sccache 2>/dev/null || true; fi'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:toolchain-parity:
    desc: |
      Assert every workflow's pinned `toolchain:` equals rust-toolchain.toml's
      `channel`.

      taskfile-ci-parity covers the COMMANDS (CI runs `task ci`), but that only
      makes CI and local identical if they also run the same COMPILER. They did
      not: workflows pinned a nightly while a contributor's rustup default is
      usually stable, and nightly clippy carries lints stable does not. PR #259
      passed `cargo clippy -D warnings` locally and failed the runner on
      `unnecessary_sort_by`.

      rust-toolchain.toml closes that for anyone using rustup. This gate stops
      the two pins from drifting back apart.
    cmds:
      - |
        set -eu
        PIN=$(grep -E '^channel *=' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
        if [ -z "$PIN" ]; then echo "could not read channel from rust-toolchain.toml"; exit 1; fi
        FAIL=0
        for wf in .github/workflows/*.yml; do
          # Workflows that never install Rust are legitimately exempt.
          grep -q 'rust-toolchain@' "$wf" || continue
          # Strip trailing comments and whitespace — a pin may legitimately
          # carry an inline `# must equal ...` note. (The gate caught itself
          # failing on exactly that.)
          for got in $(grep -E '^\s*toolchain:' "$wf" | sed -E 's/.*toolchain: *//; s/#.*//; s/[[:space:]]+$//'); do
            if [ "$got" != "$PIN" ]; then
              echo "toolchain drift: $wf pins '$got', rust-toolchain.toml says '$PIN'"
              FAIL=1
            fi
          done
        done
        [ "$FAIL" = "0" ] || { echo "--- fix: make the workflow pins match rust-toolchain.toml (or update both together)"; exit 1; }
        echo "toolchain parity OK — workflows and rust-toolchain.toml both pin $PIN"

  # --------------------------------------------------------------------------
  # Workflow parity gate (bead ley-line-open-2bea72)
  #
  # v0.12.1 failed on a capnp install that existed in release-dryrun.yml but
  # not release.yml; two hand-mirrored copies of a command WILL drift, so the
  # install commands moved into the deps:* targets below (this file's rule
  # for every other CI command already applies here). This gate asserts the
  # workflows actually call those targets and never inline an install again.
  # --------------------------------------------------------------------------

  lint:workflow-parity:
    desc: |
      Assert the workflows stay in step: no inline package installs (one copy
      lives in deps:* below), every release-pair job that installs Rust calls
      `task deps:capnp`, every image-building job calls `task deps:zig`, and
      all setup-task pins are exact and identical. The v0.12.1 image job
      failed on exactly the drift this closes — the dry-run caught the bug,
      the fix landed in the dry-run file only (ley-line-open-2bea72).
    cmds:
      - sh tools/lint_workflow_parity.sh

  lint:cache-contract:
    desc: Verify the Taskfile-owned compiler-cache and release-artifact contract
    cmds:
      - |
        set -eu
        test -x tools/install_sccache.sh
        test -f tools/sccache-checksums.txt
        grep -q 'sccache-v0.15.0-' tools/sccache-checksums.txt
        grep -q '^\.tools/$' .gitignore
        grep -q '^\.cache/$' .gitignore
        grep -q 'cache:sccache:install:' Taskfile.yml
        grep -q 'cache:sccache:verify:' Taskfile.yml
        grep -q 'cache:sccache:stats:' Taskfile.yml
        grep -q 'sources:' Taskfile.yml
        grep -q 'generates:' Taskfile.yml
        # These assert the task EXISTS where the include map says it does, and
        # that the ci chain invokes it. They previously grepped this file for
        # the definition, which broke when the task moved to a crate Taskfile.
        #
        # NOT via `task --summary`: that is a nested invocation of the runner
        # already executing this task, and it behaved differently in GitHub CI
        # than locally. A gate must not depend on behaviour that varies between
        # a developer's machine and CI.
        grep -q '^  test:cdc-activation:$' rs/ll-open/cli-lib/Taskfile.yml
        grep -q '^      - task: cli-lib:test:cdc-activation$' Taskfile.yml
        test -f .cargo/config.toml
        grep -q 'link-arg=-Wl,--threads=2' .cargo/config.toml
        grep -q 'task cache:sccache:install' .github/workflows/ci.yml
        grep -q 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' .github/workflows/ci.yml
        grep -q 'path: .cache/sccache' .github/workflows/ci.yml
        grep -Eq '^  SCCACHE_DIR: .*github\.workspace.*/\.cache/sccache$' .github/workflows/ci.yml
        grep -q 'task cache:sccache:stats' .github/workflows/ci.yml
        if grep -Eq 'run:.*cargo (build|test|clippy)' .github/workflows/ci.yml; then
          echo "ci.yml must delegate Rust commands to Taskfile.yml"
          exit 1
        fi
        test -x tools/stage_release_artifacts.sh
        test -x tools/verify_release_artifacts.sh
        test -x tools/prepare_public_release.sh
        test -x tools/verify_public_release.sh
        test -x tools/publish_release_assets.sh
        test -x tools/release_publish.sh
        test -x tools/recover_release_manifest.sh
        test -f tools/release-assets.txt
        test -f tools/release-version-manifests.txt
        grep -q 'release:artifacts:stage:' Taskfile.yml
        grep -q 'release:artifacts:verify:' Taskfile.yml
        grep -q 'release:artifacts:prepare:' Taskfile.yml
        grep -q 'release:artifacts:publish:' Taskfile.yml
        grep -q 'release:publish:' Taskfile.yml
        grep -q 'release:verify-public:' Taskfile.yml
        grep -q 'release:recover-manifest:' Taskfile.yml
        grep -q -- '- task: release:artifacts:fixture-test' Taskfile.yml
        # The FFI staticlib is built with cdc. This command moved to the fs
        # crate Taskfile, so assert it there rather than here.
        grep -Eq 'cargo build -p leyline-fs --lib --features cdc$' rs/ll-open/fs/Taskfile.yml
        # Still asserted against the root file: release:ffi is repo-level
        # release orchestration and has not moved.
        grep -Eq 'cargo build --release --lib -p leyline-fs --features cdc --target' Taskfile.yml
        # The wasm publish set (ley-line-open-a2099a, ley-line-open-be5f86):
        # build commands live in the crate Taskfiles, the deps target and
        # asset names in the release contract. Feature pins asserted verbatim
        # — `root-signer` ON / `host` OFF is what keeps the published sign
        # artifact the documented surface, and the envelope build is
        # deliberately pin-free (its manifest's `default-features = false` on
        # leyline-sign is what keeps ITS export surface verification-only).
        grep -q 'deps:wasm32:' Taskfile.yml
        grep -Eq 'cargo build --release -p leyline-sign --features root-signer --target wasm32-unknown-unknown$' rs/ll-open/sign/Taskfile.yml
        grep -Eq 'cargo build --release -p leyline-cas-ffi --target wasm32-unknown-unknown$' rs/ll-open/cas-ffi/Taskfile.yml
        grep -Eq 'cargo build --release -p leyline-envelope --target wasm32-unknown-unknown$' rs/ll-open/envelope/Taskfile.yml
        grep -q '^leyline_sign.wasm$' tools/release-assets.txt
        grep -q '^leyline_cas_ffi.wasm$' tools/release-assets.txt
        grep -q '^leyline_envelope.wasm$' tools/release-assets.txt
        grep -q 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' .github/workflows/release.yml
        grep -q 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' .github/workflows/release.yml
        awk '
          /^  build:/ { section = "build" }
          /^  publish:/ { section = "publish" }
          /^  [a-zA-Z0-9_-]+:/ && $1 != "build:" && $1 != "publish:" { section = "" }
          section == "build" && /contents: read/ { build_read = 1 }
          section == "publish" && /contents: write/ { publish_write = 1 }
          END { exit !(build_read && publish_write) }
        ' .github/workflows/release.yml
        if grep -Eq '^[[:space:]]+cargo build ' .github/workflows/release.yml; then
          echo "release.yml must delegate Cargo builds to Taskfile.yml"
          exit 1
        fi
        echo "cache contract OK"

  cache:sccache:install:
    desc: Install the pinned sccache binary for this host
    sources:
      - tools/install_sccache.sh
      - tools/sccache-checksums.txt
    generates:
      - .tools/bin/sccache
    method: checksum
    cmds:
      - tools/install_sccache.sh "{{.SCCACHE_VERSION}}" "{{.SCCACHE_BIN}}" tools/sccache-checksums.txt

  cache:sccache:verify:
    desc: Verify the Taskfile-managed sccache version
    deps: [cache:sccache:install]
    cmds:
      - |
        test "$("{{.SCCACHE_BIN}}" --version)" = "sccache {{.SCCACHE_VERSION}}"
        echo "sccache parity OK — $("{{.SCCACHE_BIN}}" --version)"

  cache:sccache:zero:
    desc: Reset compiler-cache statistics without deleting cached objects
    deps: [cache:sccache:install]
    cmds:
      - '"{{.SCCACHE_BIN}}" --zero-stats'

  cache:sccache:stats:
    desc: Print compiler-cache statistics
    cmds:
      - |
        if [ -x "{{.SCCACHE_BIN}}" ]; then
          "{{.SCCACHE_BIN}}" --show-stats
        else
          echo "Taskfile-managed sccache is not installed; no stats available"
        fi

  # --------------------------------------------------------------------------
  # CI system dependencies (bead ley-line-open-2bea72)
  #
  # One copy of every install command, invoked by the workflows — the same rule
  # the rest of this repo already follows for build/test commands. v0.12.1
  # failed on a capnp install that existed in release-dryrun.yml but not
  # release.yml; two hand-mirrored copies of a command WILL drift, so there is
  # now one copy here. tools/lint_workflow_parity.sh (wired into `task ci`)
  # asserts the workflows actually call these and never inline an install.
  #
  # `sudo` is deliberate: these run on CI runners. Locally they work too, but
  # your package manager will ask for your password — that is the target doing
  # what it says, not a bug.
  # --------------------------------------------------------------------------

  deps:capnp:
    desc: |
      Install the capnp compiler + standard schema includes + pkg-config.
      `leyline-schema-capnp`'s build script shells out to the capnp compiler,
      and libcapnp-dev (brew: capnp) ships the standard includes that
      `import "/capnp/c++.capnp"` resolves against — the capnproto package
      alone is just the binaries. Single source for ci.yml, release.yml,
      release-dryrun.yml, and leyline-schema-go.yml.
    cmds:
      - |
        set -eu
        case "${RUNNER_OS:-$(uname -s)}" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev pkg-config
            ;;
          macOS|Darwin)
            brew install capnp pkg-config
            ;;
          *)
            echo "deps:capnp: unsupported OS '${RUNNER_OS:-$(uname -s)}'" >&2
            exit 1
            ;;
        esac
        capnp --version
        pkg-config --version

  deps:ci:
    desc: |
      Everything `task ci` compiles against on a Linux runner: the capnp
      toolchain plus libdbus-1-dev (keyring) and libfuse-dev (fuser).
      ci.yml calls this; the extras ride on deps:capnp's apt-get update.
    cmds:
      - task: deps:capnp
      - sudo apt-get install -y --no-install-recommends libdbus-1-dev libfuse-dev

  deps:fuse:
    desc: |
      FUSE headers for the leyline-fs staticlib build (`fuse` feature links
      libfuse3). release.yml's build job calls this only for matrix entries
      that carry lib_asset.
    cmds:
      - |
        set -eu
        case "${RUNNER_OS:-$(uname -s)}" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libfuse3-dev
            ;;
          macOS|Darwin)
            brew install --cask fuse-t
            ;;
          *)
            echo "deps:fuse: unsupported OS '${RUNNER_OS:-$(uname -s)}'" >&2
            exit 1
            ;;
        esac

  deps:zig:
    desc: |
      The zigbuild cross-toolchain the OCI image build compiles with, plus
      the musl rustup target. RUST_TARGET is required — the image jobs pass
      their matrix target; there is no safe default to guess.
    requires:
      vars: [RUST_TARGET]
    cmds:
      - cargo install cargo-zigbuild --locked
      - python3 -m pip install --break-system-packages ziglang
      - rustup target add "{{.RUST_TARGET}}"

  deps:cargo-mutants:
    desc: |
      cargo-mutants from source with --locked — installed from source rather
      than a prebuilt-binary action because every action in this repo is
      SHA-pinned against a verified commit, and an unvetted third-party
      action isn't a trade this repo makes to save ~2 min.
    cmds:
      - cargo install cargo-mutants --locked

  deps:wasm32:
    desc: |
      The wasm32-unknown-unknown rustup target the wasm publish artifacts
      (`sign:wasm:build` / `cas-ffi:wasm:build` / `envelope:wasm:build`)
      compile against. Idempotent
      — `rustup target add` is a no-op when the target is already installed.
      Single source for release.yml and release-dryrun.yml, same rule as
      every other deps:* target here.
    cmds:
      - rustup target add wasm32-unknown-unknown

  release:artifacts:fixture-test:
    desc: Prove staged release manifests accept exact bytes and reject corruption
    vars:
      FIXTURE_DIR:
        sh: mktemp -d "${TMPDIR:-/tmp}/leyline-release-fixture.XXXXXX"
    cmds:
      - defer: rm -r "{{.FIXTURE_DIR}}"
      - |
        set -eu
        printf '#!/bin/sh\nexit 0\n' > "{{.FIXTURE_DIR}}/leyline"
        chmod +x "{{.FIXTURE_DIR}}/leyline"
        printf 'staticlib' > "{{.FIXTURE_DIR}}/libleyline_fs.a"
        printf 'header' > "{{.FIXTURE_DIR}}/leyline_fs.h"
        printf 'tooldefs' > "{{.FIXTURE_DIR}}/execution-tools.json"
        printf 'wasm' > "{{.FIXTURE_DIR}}/leyline_sign.wasm"
        printf 'wasm' > "{{.FIXTURE_DIR}}/leyline_cas_ffi.wasm"
        printf 'wasm' > "{{.FIXTURE_DIR}}/leyline_envelope.wasm"
      - task: release:artifacts:stage
        vars:
          BUILD_TARGET: fixture-target
          ASSET_NAME: leyline-test-amd64
          OUTPUT_DIR: '{{.FIXTURE_DIR}}/artifacts/leyline-test-amd64'
          CLI_SOURCE: '{{.FIXTURE_DIR}}/leyline'
          LIB_ASSET: libleyline_fs-test-amd64.a
          STATICLIB_SOURCE: '{{.FIXTURE_DIR}}/libleyline_fs.a'
          INCLUDE_HEADER: "true"
          HEADER_SOURCE: '{{.FIXTURE_DIR}}/leyline_fs.h'
          INCLUDE_TOOLDEFS: "true"
          TOOLDEFS_SOURCE: '{{.FIXTURE_DIR}}/execution-tools.json'
          WASM_ASSETS: leyline_sign.wasm leyline_cas_ffi.wasm leyline_envelope.wasm
          WASM_SOURCE_DIR: '{{.FIXTURE_DIR}}'
      - |
        if command -v dash >/dev/null 2>&1; then
          OUTPUT_DIR="{{.FIXTURE_DIR}}/artifacts/leyline-test-dash-amd64" \
          CLI_SOURCE="{{.FIXTURE_DIR}}/leyline" \
          ASSET_NAME="leyline-test-dash-amd64" \
          dash tools/stage_release_artifacts.sh
        fi
      - task: release:artifacts:verify
        vars:
          ARTIFACT_ROOT: '{{.FIXTURE_DIR}}/artifacts'
      - |
        printf 'corruption' >> "{{.FIXTURE_DIR}}/artifacts/leyline-test-amd64/leyline-test-amd64"
        if tools/verify_release_artifacts.sh "{{.FIXTURE_DIR}}/artifacts"; then
          echo "corrupted release artifact unexpectedly verified"
          exit 1
        fi
        echo "release artifact fixture accepted exact bytes and rejected corruption"

  release:publication:fixture-test:
    desc: Prove aggregate release publication is exact and fail closed
    cmds:
      - tools/test_release_publication.sh

  release:workflow:fixture-test:
    desc: Prove the credentialed publisher is reachable only after all builds
    cmds:
      - tools/test_release_workflow.sh

  release:tags:fixture-test:
    desc: Prove release tag creation is atomic, idempotent, and version-aware
    cmds:
      - tools/test_release_tags.sh

  release:publish:fixture-test:
    desc: Prove the outer operation watches only its exact tag workflow
    cmds:
      - tools/test_release_publish.sh

  release:retry:fixture-test:
    desc: Prove transient release dependencies retry within a strict bound
    cmds:
      - tools/test_release_retry.sh

  ci:attestation:fixture-test:
    desc: Prove task ci receipts reuse only the exact tested Git tree
    cmds:
      - tools/test_ci_attestation.sh

  ci:workflow-parity:fixture-test:
    desc: Prove the parity gate fails on each drift it exists to catch
    cmds:
      - sh tools/test_workflow_parity.sh

  mutants:diff:fixture-test:
    desc: Prove diff mutation routing runs the tests that observe each changed surface
    cmds:
      - sh tools/test_mutants_diff.sh

  schema:consumer-fixture-test:
    desc: Compile the Apache daemon/wire API from an external Go module
    cmds:
      - tools/test_go_schema_consumer.sh

  schema:mcp-protocol-pin-test:
    desc: Prove the vendored MCP wire schema (ley-line-open-60f0d3) is git-tracked, digest-pinned, and structurally the 2026-07-28 revision
    dir: rs
    cmds:
      - cargo test -p leyline-mcp-protocol-schema

  release:version-check:
    desc: Require binary, schema, generated metadata, and docs to agree
    cmds:
      - tools/verify_release_version.sh

  release:crates:check:
    desc: Package the schema-spec bootstrap and verify it precedes public-schema
    cmds:
      - tools/verify_crate_publish_order.sh

  release:crates:fixture-test:
    desc: Prove the public schema crate has a valid first-publication order
    cmds:
      - tools/test_crate_publish_order.sh

  release:verify-public:
    desc: Download and verify public assets plus the Apache Go module
    requires:
      vars: [VERSION]
    cmds:
      - tools/verify_public_release_remote.sh "{{.VERSION}}"

  release:recover-manifest:
    desc: Recover one missing public SHA256SUMS from GitHub-recorded digests
    requires:
      vars: [VERSION, EXPECTED_COMMIT]
    cmds:
      - >-
        tools/recover_release_manifest.sh
        "{{.VERSION}}"
        "{{.EXPECTED_COMMIT}}"

  release:publish:
    desc: Atomically tag, wait for release CI, and verify public vVERSION
    requires:
      vars: [VERSION]
    cmds:
      - tools/release_publish.sh "{{.VERSION}}"

  check:all-features:
    desc: |
      Type-check `--features all` — the feature set `task install:full` builds,
      which ARCHITECTURE.md calls the recommended install for mache and
      downstream daemon consumers.

      `task ci` otherwise only builds DEFAULT features, so anything behind
      `vec`/`hdc`/`lsp`/`text-search` is invisible to it. That is not
      hypothetical: `daemon/embed.rs` sat on main calling `.lock().map_err(..)`
      and `if let Ok(mut q) = queue.lock()` against a `parking_lot::Mutex`,
      whose guard is not a Result. It had never compiled under `--features
      vec`, and only surfaced when the 0.10.2 release build was validated by
      hand.

      `check` not `build`: this catches the type errors at a fraction of the
      link cost. `task release:full` still does the real build.
    dir: rs
    cmds:
      - cargo check -p leyline-cli --features all

  # --------------------------------------------------------------------------
  # Build
  # --------------------------------------------------------------------------
  build:
    desc: Build the leyline binary (debug, headless — no FUSE/NFS required)
    dir: rs
    cmds:
      - cargo build -p leyline-cli

  build:mount:
    desc: Build with FUSE/NFS mount support (requires libfuse-t on macOS)
    dir: rs
    cmds:
      - cargo build -p leyline-cli --features mount

  release:
    desc: Build the leyline binary (release, headless)
    dir: rs
    cmds:
      - cargo build --release -p leyline-cli

  release:mount:
    desc: Release build with FUSE/NFS mount support
    dir: rs
    cmds:
      - cargo build --release -p leyline-cli --features mount

  install:
    desc: Build release, codesign (macOS), and install to ~/.local/bin
    deps: [release]
    cmds:
      # The binary installs ITSELF (ley-line-open-321ded): atomic staging +
      # rename, idempotent, prints the PATH export line if the dir is off
      # PATH. This task is a thin wrapper, not a second copy-step
      # implementation — the single source for install mechanics is
      # `leyline self install`, which is also what downstream consumers
      # (mache) delegate to instead of inventing their own binary home.
      - rs/target/release/leyline self install
      # macOS: ad-hoc codesign with explicit network entitlements.
      # Without this, the binary launches but is SIGKILLed on first
      # network/socket use (exit 137). The linker's adhoc signature
      # alone is insufficient — macOS evaluates the entitlements
      # plist on launch and refuses unentitled network ops. Mirrors
      # mache's install flow (which hit the same issue). Runs AFTER
      # self install: signing mutates the installed copy, so the next
      # install's byte-compare sees a diff and re-copies — correct,
      # since the fresh build is the authority.
      - cmd: codesign -s - --force --deep --entitlements entitlements.plist ~/.local/bin/leyline
        platforms: [darwin]
      - echo "installed $(~/.local/bin/leyline --version)"

  release:full:
    desc: Release build with `--features all` — everything the CLI can expose EXCEPT mount. Portable (no libfuse-t / libfuse runtime dep). Includes lsp + vec + validate + hdc + text-search + cdc.
    dir: rs
    cmds:
      - cargo build --release -p leyline-cli --features all

  release:full+mount:
    desc: Release build with `--features full` — includes mount. Requires libfuse-t (macOS `brew install fuse-t`) or libfuse (Linux `apt install libfuse-dev`) at BUILD and RUNTIME. Binary won't launch without the dylib.
    dir: rs
    cmds:
      - cargo build --release -p leyline-cli --features full

  release:target:
    desc: Build the release CLI for BUILD_TARGET (used by release.yml)
    deps: [cache:sccache:install]
    requires:
      vars: [BUILD_TARGET]
    dir: rs
    cmds:
      - cargo build --release -p leyline-cli --target "{{.BUILD_TARGET}}"

  release:fs-static:target:
    desc: Build the CDC-capable leyline-fs release staticlib for BUILD_TARGET
    deps: [cache:sccache:install]
    requires:
      vars: [BUILD_TARGET]
    dir: rs
    cmds:
      - cargo build --release --lib -p leyline-fs --features cdc --target "{{.BUILD_TARGET}}"

  release:generators:target:
    desc: Build the generator binaries downstream repos invoke, for BUILD_TARGET
    deps: [cache:sccache:install]
    requires:
      vars: [BUILD_TARGET]
    dir: rs
    # LLO ships generators that other repos RUN — capnp resolves `-o<plugin>`
    # by PATH-searching `capnpc-<plugin>`, so cloister's `task cluster:zod` and
    # rosary's tooldefs path both need these on disk. Publishing them means a
    # consumer downloads a binary instead of SHA-pinning a git dep and building
    # a build tool from source (`ley-line-open-e44960`).
    #
    # GENERATOR_BINS below is the SINGLE list: this task builds exactly it, and
    # `release:artifacts:stage` ships exactly it. Adding a binary in one place
    # and not the other is the drift this consolidation prevents.
    cmds:
      - >-
        cargo build --release --target "{{.BUILD_TARGET}}"
        -p leyline-schema-bridge
        --bin capnpc-schema-bridge-zod
        --bin capnpc-schema-bridge-go
        --bin capnpc-schema-bridge-jsonschema
        --bin capnpc-schema-bridge-tooldefs
      - >-
        cargo build --release --target "{{.BUILD_TARGET}}"
        -p leyline-mcp-descriptor --bin leyline-mcp-descriptor

  release:artifacts:stage:
    desc: Stage one target's exact release outputs and SHA-256 manifest
    requires:
      vars: [BUILD_TARGET, ASSET_NAME]
    vars:
      DEFAULT_OUTPUT_DIR: '{{.ROOT_DIR}}/.artifacts/staged/{{.ASSET_NAME}}'
      DEFAULT_CLI_SOURCE: '{{.ROOT_DIR}}/rs/target/{{.BUILD_TARGET}}/release/leyline'
      DEFAULT_STATICLIB_SOURCE: '{{.ROOT_DIR}}/rs/target/{{.BUILD_TARGET}}/release/libleyline_fs.a'
      DEFAULT_HEADER_SOURCE: '{{.ROOT_DIR}}/rs/ll-open/fs/include/leyline_fs.h'
      DEFAULT_TOOLDEFS_SOURCE: '{{.ROOT_DIR}}/rs/ll-open/cli-lib/src/daemon/execution-tools.json'
    env:
      ASSET_NAME: '{{.ASSET_NAME}}'
      BUILD_TARGET: '{{.BUILD_TARGET}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR | default .DEFAULT_OUTPUT_DIR}}'
      CLI_SOURCE: '{{.CLI_SOURCE | default .DEFAULT_CLI_SOURCE}}'
      LIB_ASSET: '{{.LIB_ASSET | default ""}}'
      INCLUDE_HEADER: '{{.INCLUDE_HEADER | default "false"}}'
      # The generated execution/v1 tool definitions — one platform-independent
      # JSON, so exactly ONE release job sets this (same single-uploader rule
      # as INCLUDE_HEADER). Off by default.
      #
      # Only the FLAG lives here. `TOOLDEFS_SOURCE` is exported from `cmds`
      # under this flag, exactly as `HEADER_SOURCE` is: putting the path in
      # `env` would set it on every leg, the stage script's `-n` test would
      # fire everywhere, and three copies would each land in the basename
      # inventory and break the expected-asset diff.
      INCLUDE_TOOLDEFS: '{{.INCLUDE_TOOLDEFS | default "false"}}'
      # The generator binaries, staged as `<bin>-<suffix>` alongside the CLI.
      # Empty by default so a caller that only wants the CLI is unaffected;
      # release.yml sets it for every target. Same list as
      # `release:generators:target` builds — see the comment there.
      GENERATOR_BINS: '{{.GENERATOR_BINS | default ""}}'
      GENERATOR_SOURCE_DIR: '{{.ROOT_DIR}}/rs/target/{{.BUILD_TARGET}}/release'
      # `leyline-darwin-arm64` -> `darwin-arm64`, so a generator asset reads
      # `capnpc-schema-bridge-zod-darwin-arm64` and matches the CLI's scheme.
      GENERATOR_SUFFIX: '{{.GENERATOR_SUFFIX | default (trimPrefix "leyline-" .ASSET_NAME)}}'
      # Platform-independent wasm32 artifacts (ley-line-open-a2099a), staged
      # as-is with no per-target suffix — one artifact each for every
      # platform, so exactly ONE release job sets this (same single-uploader
      # rule as INCLUDE_HEADER). Empty by default.
      WASM_ASSETS: '{{.WASM_ASSETS | default ""}}'
      WASM_SOURCE_DIR: '{{.WASM_SOURCE_DIR | default (printf "%s/rs/target/wasm32-unknown-unknown/release" .ROOT_DIR)}}'
    cmds:
      - |
        set -eu
        if [ -n "${LIB_ASSET:-}" ]; then
          export STATICLIB_SOURCE='{{.STATICLIB_SOURCE | default .DEFAULT_STATICLIB_SOURCE}}'
        fi
        if [ "${INCLUDE_HEADER:-false}" = "true" ]; then
          export HEADER_SOURCE='{{.HEADER_SOURCE | default .DEFAULT_HEADER_SOURCE}}'
        fi
        if [ "${INCLUDE_TOOLDEFS:-false}" = "true" ]; then
          export TOOLDEFS_SOURCE='{{.TOOLDEFS_SOURCE | default .DEFAULT_TOOLDEFS_SOURCE}}'
        fi
        tools/stage_release_artifacts.sh

  release:artifacts:verify:
    desc: Verify downloaded release artifact manifests and unique asset names
    requires:
      vars: [ARTIFACT_ROOT]
    cmds:
      - tools/verify_release_artifacts.sh "{{.ARTIFACT_ROOT}}"

  release:artifacts:prepare:
    desc: Verify target artifacts and create one aggregate publication set
    requires:
      vars: [ARTIFACT_ROOT, PUBLICATION_DIR]
    cmds:
      - >-
        tools/prepare_public_release.sh
        "{{.ARTIFACT_ROOT}}"
        "{{.PUBLICATION_DIR}}"
        tools/release-assets.txt

  release:artifacts:verify-public:
    desc: Verify an exact aggregate release directory and SHA256SUMS
    requires:
      vars: [PUBLICATION_DIR]
    cmds:
      - >-
        tools/verify_public_release.sh
        "{{.PUBLICATION_DIR}}"
        tools/release-assets.txt

  release:artifacts:publish:
    desc: Reverify, then create the release and upload its exact asset set
    requires:
      vars: [PUBLICATION_DIR, TAG]
    cmds:
      - >-
        tools/publish_release_assets.sh
        "{{.PUBLICATION_DIR}}"
        "{{.TAG}}"
        tools/release-assets.txt

  install:full:
    desc: Build with `--features all` (everything except mount), codesign (macOS), and install to ~/.local/bin. Portable — no system-dep prerequisites. This is the recommended full install for mache + downstream daemon consumers.
    deps: [release:full]
    cmds:
      # Thin wrapper over `leyline self install` — see `install:`.
      - rs/target/release/leyline self install
      # Same ad-hoc codesign flow as `task install`. See the comment
      # on that task for the SIGKILL-on-network rationale.
      - cmd: codesign -s - --force --deep --entitlements entitlements.plist ~/.local/bin/leyline
        platforms: [darwin]
      - echo "installed (full) $(~/.local/bin/leyline --version)"

  "install:full+mount":
    desc: Build with `--features full` INCLUDING mount, codesign (macOS), and install. ONLY use this if libfuse-t (macOS) / libfuse (Linux) is installed at runtime — otherwise the binary won't launch, even for non-mount ops.
    deps: [release:full+mount]
    cmds:
      # Thin wrapper over `leyline self install` — see `install:`.
      - rs/target/release/leyline self install
      - cmd: codesign -s - --force --deep --entitlements entitlements.plist ~/.local/bin/leyline
        platforms: [darwin]
      - echo "installed (full+mount) $(~/.local/bin/leyline --version)"

  # --------------------------------------------------------------------------
  # Test
  # --------------------------------------------------------------------------
  test:
    desc: Run all tests
    dir: rs
    cmds:
      - cargo test --workspace

  test:lib:
    desc: Run library tests only (no integration tests)
    dir: rs
    cmds:
      - cargo test --workspace --lib

  test:cli:
    desc: Run CLI integration tests
    cmds:
      - task: cli-lib:test

  # `vec` and `text-search` SHIP — README documents `task install:full`, which
  # builds `--features all` and includes both — but no test target enabled
  # them, so 27 and 16 inline `#[cfg]` sections inside otherwise-running tests
  # never compiled. `cargo test -p leyline-cli-lib` uses the DEFAULT set
  # (lsp, validate, hdc, cdc), which excludes them.
  #
  # Both pass today; this is turning on existing coverage, not writing new.
  # Enforced by `lint:feature-reachability`, which fails when a shipping
  # feature has no test target (bead ley-line-open-2607d2).
  conformance:py:
    desc: |
      Python conformance suite for cloister/credential-isolation/v1
      (bead ley-line-open-f47f43). Runs the reference Python
      implementation against the pinned test vectors under
      rs/ll-core/schema-spec/credential-isolation/v1/. Requires
      python3 on PATH; skips gracefully with a clear message if
      absent so the target is invocable in any dev environment.
    dir: rs/ll-core/schema-spec/credential-isolation/v1/ref-impl-py
    cmds:
      - |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "conformance:py — python3 not on PATH; skipping (this is a Python-only conformance suite)."
          exit 0
        fi
        python3 conformance/run.py

  test:perf:
    desc: Cold-parse perf regression gate (bead ley-line-open-a3f254).
    # Release mode is non-negotiable — the optimisations under test only
    # matter in --release. LLO_PERF_GATES=1 flips the assertion path on;
    # without it, the test prints timings but skips the threshold check
    # (Copilot finding 9 on PR #20 — wall-clock budgets flake under CI
    # noise unless explicitly opted in).
    #
    # Topology gates (topology_pass_test) ALSO read LLO_PERF_GATES but
    # have tighter budgets that flake under modest concurrent CPU load.
    # Run them via `task test:perf:topology` when you want that signal;
    # they're observable in the always-emitted stderr timings during
    # plain `task test` regardless.
    dir: rs
    env:
      LLO_PERF_GATES: "1"
    cmds:
      - cargo test --release -p leyline-cli-lib --test cold_parse_perf_regression
      # F2 substrate falsifier (parallel-vs-serial write throughput). Lives
      # here rather than in `task test` because it is a wall-clock ratio: under
      # CPU contention the parallel arm gets no speedup and it fails without a
      # regression. It always PRINTS its measurement in `task test`; this is
      # where the assertion is enforced.
      - cargo test --release -p leyline-cli-lib --test f2_concurrent_writers_throughput
      # Sheaf restriction-vs-review wall-time corroboration. Same shape as F2:
      # the ROW-COUNT invariant is asserted on every push inside the test, and
      # only the wall-clock comparison is gated here. It measures at microsecond
      # scale (7.6us vs 852us on a quiet run, but 649us vs 424us on a loaded
      # one), so it is a scheduler race in the every-push gate and a real
      # signal here.
      - cargo test --release -p leyline-sheaf --test restriction_review_public_api
      # WAL reader-pool throughput floor. Same shape again: the pool's
      # CORRECTNESS properties — query_only on every checkout, writers
      # serializing without corruption, exhaustion blocking rather than
      # failing — are asserted on every push inside that test, and only the
      # absolute reads-per-1.5s floor is gated here. It is 80k against a
      # healthy ~120k, so roughly 1.5x of headroom on an absolute count of
      # wall-clock work, which a loaded machine loses while the pool is
      # behaving: 67389 reads against a 46359 mutex baseline is the pool
      # winning 1.45x and failing the floor anyway. Its predecessor was a
      # ratio-vs-mutex assertion, moved to an absolute floor because the
      # divisor swung with scheduler noise; both flake, in opposite
      # directions, so it belongs here rather than being retuned again.
      - cargo test --release -p leyline-cli-lib --test wal_pool_concurrent_readers_daemon_test

  test:perf:topology:
    desc: Topology pre-pass cost gates (opt-in; tighter budgets than test:perf).
    dir: rs
    env:
      LLO_PERF_GATES: "1"
    cmds:
      - cargo test --release -p leyline-cli-lib --test topology_pass_test

  adr-0029:baseline:
    desc: |
      Run the ADR-0029 F-test baseline harness — captures worktree-flow
      wall-time / storage / isolation / sub-file / commit-fidelity
      numbers and writes them to docs/research/adr-0029-baselines.json
      + docs/research/adr-0029-f5w-baseline.diff.

      SLOW: synths a 100MB git repo and runs 30 `git worktree add`
      iterations for F1w, plus 4 more for F2w. Not on the every-PR
      CI path — run when Phase 1 mount driver work needs a refreshed
      reference number (bead ley-line-open-5f9829).

      Fast F-tests (F3w isolation, F4w sub-file, F5w commit fidelity)
      run in `task ci` — no `--ignored` needed for those.
    dir: rs
    cmds:
      - cargo test -p leyline-cli-lib --test adr_0029_baseline_test --release -- --ignored --nocapture

  # `leyline-sign` `host` feature (ADR-0019 helper daemon, absorbed from
  # cloister under bead ley-line-open-7226e3). Kept out of the workspace
  # default so `cargo test --workspace` doesn't pull the axum/tokio/keyring
  # closure; wired into `ci` explicitly below.
  #
  # `host-extras` (op:// + apple-password:// schemes via nono 0.54) is
  # NOT built here — nono requires rustc 1.95 and this workspace pins
  # 1.94. When the workspace toolchain bumps, add
  # `cargo build -p leyline-sign --features host,host-extras` under the
  # `sign:host:build:extras` target below and wire it into ci.
  sign:host:build:extras:
    desc: Build leyline-sign under `--features host,host-extras` (requires rustc >= 1.95 for nono 0.54).
    dir: rs
    cmds:
      - cargo build -p leyline-sign --features host,host-extras

  # --------------------------------------------------------------------------
  # Quality
  # --------------------------------------------------------------------------
  clippy:
    desc: Run clippy on all crates
    dir: rs
    cmds:
      - cargo clippy --workspace -- -D warnings

  check:
    desc: Fast type-check without codegen
    dir: rs
    cmds:
      - cargo check --workspace

  check:commit:
    desc: Fast pre-commit gate — staged whitespace, Rust formatting, and type-check
    deps: [cache:sccache:install]
    cmds:
      - task: lint:staged
      - task: fmt:check
      - task: check

  lint:staged:
    desc: Reject whitespace errors in the exact patch staged for commit
    cmds:
      - git diff --cached --check

  fmt:check:
    desc: Verify formatting (CI gate; use `task fmt` locally to fix)
    dir: rs
    cmds:
      - cargo fmt --all -- --check

  fmt:
    desc: Apply formatting in place
    dir: rs
    cmds:
      - cargo fmt --all

  lint:blake3:
    desc: |
      Σ Phase 4 lint gate (ley-line-open-32201a follow-up). Forbids
      direct `blake3::hash` calls in `rs/ll-open/` outside the explicit
      allowlist in `tools/blake3-allowlist.txt`. Auto-allows tests/,
      benches/, in-file `#[cfg(test)]` blocks, and comment-only lines.
      Closes the Σ retrofit ladder so substrate.rs's documented
      invariants stay load-bearing.
    cmds:
      - tools/lint_blake3.sh

  taskfile:anchors:fixture-test:
    desc: |
      Prove every included Taskfile's `dir:` resolves to the cargo workspace
      from the repo root, from `rs/`, and from inside a package directory.

      Both failure modes this defends against create a wrong directory and run
      in it rather than erroring, so neither is visible from the repo root —
      which is the only place CI ever invokes `task`.
    cmds:
      - tools/test_taskfile_anchors.sh

  lint:architecture-vocabulary:
    desc: Keep storage identity domains distinct in architecture documentation
    cmds:
      - sh tools/check_architecture_vocabulary.sh .

  # Claims, not vocabulary. `lint:architecture-vocabulary` asserts that terms
  # are present or absent, which a document can satisfy while still stating
  # something false — it passed green while the docs named a decade that does
  # not exist, claimed SHA-256 lived in two places when a third shipped, and
  # described a capnp read path mache does not implement. Every assertion here
  # is checked against the repository, so it fails when the code moves.
  lint:doc-claims:
    desc: Verify documentation claims against the code they describe (ADR-0032 §D4)
    cmds:
      - sh tools/check_doc_claims.sh .

  # A feature no shipping configuration enables is compiled out of every
  # binary, and a test that enables it proves a capability the shipped
  # artifact does not have. `leyline-fs/splice` was exactly that: enabled only
  # by the test targets, so `flush_node` was a silent no-op in every build
  # while a green test said otherwise (ley-line-open-918a75). Reachability is
  # cargo's answer, not a grep — a grep-based first cut had a 97%
  # false-positive rate, and a gate that cries wolf gets muted.
  lint:feature-reachability:
    desc: Every declared feature must be reachable from a shipping configuration
    cmds:
      - sh tools/check_feature_reachability.sh .

  # Pairs with lint:feature-reachability, which asks whether gated code COMPILES
  # somewhere. This asks the different question that gate cannot: whether the
  # mutation slice that reaches a gated module actually compiles it, or honestly
  # excludes it. A module that is enumerated but compiled out reports MISSED
  # having tested nothing (bead `ley-line-open-b23c41`).
  lint:mutants-cfg-coverage:
    desc: Every cfg-gated module is compiled by its mutation slice or excluded from it
    cmds:
      - sh tools/check_mutants_cfg_coverage.sh

  # --------------------------------------------------------------------------
  # Smell-rule gate (workspace deps drift + unsafe/unwrap invariants).
  # Mache-shaped: `smell-projector` walks `rs/`, projects Cargo.toml
  # into `workspace_deps` + `crate_deps` and `*.rs` sources into
  # `unsafe_sites` + `unwrap_sites`, runs the rules in `smell-rules/*.json`,
  # and diffs findings against `docs/smell-baseline.json`.
  #
  # Rule + baseline shape mirror mache's `find-smells` exactly (ID,
  # Description, Requires, ScopeColumn, Query %s placeholder; baseline
  # version + counts array) so the engine is swappable for mache proper
  # if we ever want to unify. Same discipline `task compat:check` uses
  # for compatibility.json.
  #
  # Renamed from `cargo-toml-projector` once the source-projection tables
  # landed (bead `ley-line-open-85fb1f`); old name lied about scope.
  # --------------------------------------------------------------------------
  smells:
    desc: "Smell-rule gate — fail on NEW findings vs docs/smell-baseline.json (beads ley-line-open-3b2f55, 85fb1f)"
    dir: rs
    cmds:
      - cargo run -p smell-projector --quiet -- --repo-root ..

  smells:baseline:
    desc: "Regenerate docs/smell-baseline.json — grandfather current drift (run after a deliberate change and commit the baseline)"
    dir: rs
    cmds:
      - cargo run -p smell-projector --quiet -- --repo-root .. --write-baseline
      - echo "regenerated docs/smell-baseline.json"

  smells:dogfood:
    desc: "Dogfood — print all smell findings without a gate"
    dir: rs
    cmds:
      - cargo run -p smell-projector --quiet -- --repo-root .. --dogfood

  # --------------------------------------------------------------------------
  # FFI / staticlib
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # Mutation testing — the gate that checks the TESTS, not the code.
  #
  # Why this exists: the chunked-content path can fail in a way no correctness
  # test can see. Widening the overlap predicate (`<` → `<=`) fetches an extra
  # non-overlapping chunk per read — the bytes returned are still correct, so
  # every round-trip test passes while the module's entire reason for existing
  # is defeated. `cargo mutants` catches exactly that class, and it already
  # earned its keep twice on first run:
  #   - `reconstruct`'s `c.offset + c.len` → `* ` survived, revealing the total
  #     was an upper bound that `read_range` silently clamped (now removed).
  #   - `ORDER BY seq` in the range query was unverifiable dead weight (removed).
  #
  # Scoped to the three modules carrying falsifiable claims, not the workspace
  # — a whole-workspace run is hours. Each module gets its own task so local
  # work can run the narrow gate; the path-filtered workflow runs all three.
  #
  # NOT in `task ci`: ~3 min warm, and it rebuilds per mutant so a cold run is
  # several times that. Runs in its own path-filtered workflow
  # (.github/workflows/mutants.yml) and on demand via `task mutants`.
  #
  # ── The coverage ladder (`ley-line-open-085dff`) ──────────────────────────
  #
  # Two complementary modes, because they answer different questions:
  #
  #   `mutants`        FULL coverage of an allowlist. Answers "do the tests for
  #                    THIS module still bite?" Grows one justified entry at a
  #                    time. A whole-workspace run enumerates 5806 mutants and
  #                    is not a thing anyone will wait for.
  #
  #   `mutants:diff`   Coverage of the lines a change touches. Answers "are the
  #                    tests for THIS PR real?" Cost is proportional to the
  #                    diff, so it can be on for everything.
  #
  # Add a rung when a real defect justifies it, not when a file seems
  # important. Current allowlist and why each earned it:
  #
  #   leyline-cdc, chunked.rs   the overlap-predicate class described above
  #   gc.rs                     transactional reachability + accounting
  #   ll-core/core/partition.rs `ad272d3` collided materially different
  #                             decompositions into one address, and the only
  #                             detector was in a DOWNSTREAM repo's tree
  #                             (`ley-line-open-afa8be`). A collision in a
  #                             content-addressed substrate is the worst
  #                             failure class here: silent, corrupts identity,
  #                             and every layer above inherits it.
  #
  # Climb the ladder in tier order, because the tier boundary decides the cost.
  # `ll-core/*` compiles without `ll-open/*` (the tier-isolation gate), so those
  # crates mutate with no feature incantation at all — note `mutants:fs` needs
  # `--no-default-features --features cdc,splice,validate` purely because
  # leyline-fs reaches libfuse. Ask "which tier is this in?" before "is this
  # important?": a file in the wrong tier is expensive to mutate regardless.
  #
  # Next rungs, both already tier-clean: the schema-bridge emitters
  # (`8c00c6` and `f72fca` were both silent WRONG-OUTPUT bugs this week — the
  # class mutation testing is good at and review is bad at).
  # --------------------------------------------------------------------------
  mutants:
    desc: Mutation-test the allowlist (CDC, chunked path, partition address). Fails if any mutant survives.
    cmds:
      - task: mutants:cdc
      - task: mutants:fs
      - task: mutants:fs-gc
      - task: mutants:partition

  mutants:partition:
    desc: Mutation-test the partition address fold — the Σ address algebra.
    dir: rs
    # `leyline-core` is tier-isolated, so no feature flags are needed here —
    # contrast `mutants:fs` below. Earned its place via `ley-line-open-afa8be`:
    # the set-domain fold dropped Entry framing, collapsing different
    # decompositions onto one address, and upstream tests stayed green because
    # the one that checked framing covered a single domain of three
    # (`ley-line-open-c3916b`).
    cmds:
      - >-
        cargo mutants -p leyline-core --test-workspace=false
        -C --lib --file ll-core/core/src/partition.rs

  mutants:diff:
    desc: Mutation-test only the Rust lines a diff touches. Requires DIFF=<path>.
    requires:
      vars: [DIFF]
    # FOUR outcomes, deliberately distinguished. Three of them can look green
    # or misleadingly similar in a naive implementation:
    #
    #   tested N        mutants ran; survivors fail the gate.
    #   SKIPPED         the diff changes no Rust. Nothing ran — reported as
    #                   skipped, never as a pass.
    #   MISCONFIGURED   the diff DOES change Rust but enumerated zero mutants.
    #                   Hard failure.
    #   BASELINE BROKEN the unmutated scratch tree failed before mutation.
    #                   Hard failure, distinct from a surviving mutant.
    #
    # MISCONFIGURED is the trap this task exists to avoid. `cargo mutants` runs in
    # `rs/`, so the diff's paths must be workspace-relative (`a/ll-core/...`).
    # A diff produced from the repo root carries `a/rs/ll-core/...`, matches
    # nothing, prints "No mutants to filter", and EXITS 0 — a permanently green
    # check that tests nothing, from a path prefix. Generate the diff with
    # `git diff --relative=rs`.
    cmds:
      # Compatibility entry point for workflows and contributors. The Rust
      # workspace Taskfile owns cargo-mutants configuration and execution.
      - task: rs:mutants:diff
        vars:
          DIFF: '{{.DIFF}}'
          MUTANTS_SCOPE: '{{.MUTANTS_SCOPE | default "all"}}'

  mutants:pr:
    desc: |
      Run the PR mutants gate locally: the exact diff-scoped run mutants.yml
      executes, against your branch's diff from the integration base by
      default — INCLUDING
      uncommitted work, since that is what you are about to commit and push.
      Exists because each surviving mutant discovered on the runner costs a
      ~35-minute CI round trip to learn about; this surfaces the survivor
      list before the push instead of after (PR #308 took three such trips).
      Set MUTANTS_SCOPE=runtime or MUTANTS_SCOPE=cli for a focused local
      feedback loop; CI always uses the default all-slices scope.
    cmds:
      - task: rs:mutants:pr
        vars:
          MUTANTS_SCOPE: '{{.MUTANTS_SCOPE | default "all"}}'

  mutants:fs:
    desc: Mutation-test leyline-fs::chunked (the SQL materialize-on-read path).
    dir: rs
    cmds:
      # `-C --lib`: the FFI smoke test links against a staticlib in the real
      # target dir, which doesn't exist in the mutant scratch build. Lib tests
      # are where every chunked assertion lives anyway.
      #
      # Exit 3 = "some mutants timed out" — the same stance as mutants:cdc: a
      # mutant the suite STOPS (hang killed by the harness) is detected, not
      # missed. Exit 2 (a mutant no test caught) still fails.
      - >-
        cargo mutants -p leyline-fs --test-workspace=false
        --no-default-features --features cdc,splice,validate
        -C --lib --file ll-open/fs/src/chunked.rs
        || [ $? -eq 3 ]

  mutants:fs-gc:
    desc: Mutation-test transactional CDC reachability and accounting.
    dir: rs
    cmds:
      # Exit 3 tolerated for the same reason as mutants:fs/mutants:cdc.
      - >-
        cargo mutants -p leyline-fs --test-workspace=false
        --no-default-features --features cdc,splice,validate
        -C --lib --file ll-open/fs/src/gc.rs
        || [ $? -eq 3 ]

  mutants:cdc:
    desc: Mutation-test leyline-cdc (chunking + range reads).
    dir: rs
    cmds:
      # Exit 3 = "some mutants timed out". For this crate that IS detection:
      # the surviving-loop mutants (`< `→`<=` in the scan, `next_boundary -> 0`)
      # make chunking never terminate, so a hang is the test noticing. Exit 2
      # (a mutant no test caught) still fails, which is the point of the gate.
      - >-
        cargo mutants -p leyline-cdc --test-workspace=false
        -C --lib --file ll-open/cdc/src/lib.rs
        || [ $? -eq 3 ]

  # --------------------------------------------------------------------------
  # Tier isolation — guard against cross-tier dep creep. ll-core (Tier 1
  # OSS infrastructure) must build standalone with no transitive pull
  # from ll-open (Tier 2). A failure here means a Tier 1 crate has
  # gained a forbidden Tier 2 dep.
  # --------------------------------------------------------------------------
  tier:isolation:
    desc: Verify ll-core crates build without ll-open
    dir: rs
    cmds:
      - cargo build -p leyline-core -p leyline-schema -p leyline-public-schema

  # --------------------------------------------------------------------------
  # Image build (cargo-zigbuild + docker → distroless OCI image)
  # --------------------------------------------------------------------------
  # Two-step: cargo-zigbuild produces a static musl binary (no docker
  # daemon involved in the compile); docker assembles a one-layer image by
  # COPYing that binary onto cgr.dev/chainguard/static:latest. See image.Dockerfile.
  #
  # Why not apko/melange? See ley-line-open-2b255c. tl;dr on Apple Silicon
  # the melange-via-docker workspace bind-mount stalls on virtiofs and
  # leaks ~30 GB tmpdirs per run; apko's `archs: [x86_64, aarch64]` also
  # fails when only one arch APK is built. cargo-zigbuild sidesteps both:
  # zig is the cross-linker, so no emulation and no container in the compile.
  #
  # This used to shell out to `krust`, a wrapper around cargo-zigbuild. It was
  # removed in `ley-line-open-e44960`: the only krust here was a /tmp path
  # install, and `cargo install krust` resolves to an unrelated crates.io
  # package, so the release image job could never build on any other machine.
  #
  # The image runs `leyline daemon --mcp-port 8384 --mcp-bind 0.0.0.0
  # --mcp-allow-public` headless (no FUSE). The --mcp-bind 0.0.0.0
  # override is required for docker port-forwarding to reach the
  # listener — the daemon defaults to 127.0.0.1, which is loopback-only
  # inside the container. --mcp-allow-public is the deliberate opt-in
  # added by bead `ley-line-open-b7dd03` — outside a container, the
  # daemon refuses non-loopback binds without it.
  image:
    desc: Build the LLO OCI image for one platform (zigbuild musl binary + docker COPY)
    vars:
      # Derived, never literal. A hardcoded version here is precisely how an
      # image gets published under a tag that disagrees with server.json's
      # `packages[0].version` — cloister derives `<identifier>:<version>` and
      # would resolve nothing (`ley-line-open-e44960`). The CLI crate's
      # version is the same value `verify_release_version.sh` asserts across
      # every manifest, so deriving from it cannot drift.
      VERSION:
        sh: "grep -m1 '^version = ' rs/ll-open/cli/Cargo.toml | cut -d'\"' -f2"
      # `v`-prefixed locally too, so there is exactly ONE tag convention. The
      # published tag MUST be `v`-prefixed to match server.json's
      # packages[0].version; a different local convention is a second rule to
      # get wrong, and getting it wrong is `ley-line-open-e44960`.
      IMAGE_REF: '{{.IMAGE_REF | default (printf "localhost/leyline:v%s" .VERSION)}}'
      PLATFORM: '{{.PLATFORM | default "linux/arm64"}}'
      # Derive musl target triple from PLATFORM so cross-arch builds find
      # the right binary. Image.Dockerfile's BIN_PATH default targets
      # aarch64; for amd64 we override via --build-arg below.
      RUST_ARCH:
        sh: 'case "{{.PLATFORM}}" in linux/arm64) echo aarch64;; linux/amd64) echo x86_64;; *) echo "unsupported PLATFORM: {{.PLATFORM}}" >&2; exit 1;; esac'
    # `cargo zigbuild`, NOT krust (`ley-line-open-e44960`).
    #
    # The v0.12.0 image jobs failed and could never have succeeded: the workflow
    # ran `cargo install krust --locked`, but the krust on this machine is
    # `krust v0.0.1 (/tmp/krust)` — a LOCAL PATH install no CI can reproduce —
    # while the `krust` on crates.io is an unrelated abandoned 2016 Vulkan
    # bindings wrapper. So the step either failed or installed a stranger's
    # crate on a name collision. Installing by bare name does not belong in a
    # release path.
    #
    # krust was only wrapping cargo-zigbuild here anyway (we invoked it with
    # `--no-push`), so calling zigbuild directly removes an unreproducible
    # dependency rather than replacing it with another.
    cmds:
      # `-p leyline-cli` is load-bearing, not tidiness. Without it cargo
      # resolves features across the whole workspace, drags in `leyline-fs`,
      # and fuser's build script panics — it needs libfuse, which does not
      # exist for musl. `mount` is not even in the CLI's default features;
      # workspace feature unification pulls it in regardless. Verified by
      # hitting exactly that failure while porting off krust.
      - |
        cargo zigbuild --release --manifest-path rs/Cargo.toml \
          -p leyline-cli --bin leyline \
          --target {{.RUST_ARCH}}-unknown-linux-musl
      - |
        docker build -f image.Dockerfile \
          -t {{.IMAGE_REF}} \
          --platform {{.PLATFORM}} \
          --build-arg BIN_PATH=rs/target/{{.RUST_ARCH}}-unknown-linux-musl/release/leyline \
          .
      - |
        echo "Built {{.IMAGE_REF}} ({{.PLATFORM}})."
        echo "Smoke: docker run --rm -p 127.0.0.1:18384:8384 {{.IMAGE_REF}}"
        echo "       (image CMD bakes in --mcp-bind 0.0.0.0 --mcp-allow-public — container-side"
        echo "        public bind is legitimate plumbing for docker NAT; host-side loopback"
        echo "        publish keeps the surface narrow — see image.Dockerfile security block)"
        echo "       curl -s -X POST http://localhost:18384/mcp \\"
        echo "         -H 'Content-Type: application/json' \\"
        echo "         -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}'"

  image:smoke:
    desc: Build image and run end-to-end smoke (start daemon, probe MCP tools/list)
    deps: [image]
    vars:
      # Same derivation as `image:` — see the comment there. These two MUST
      # agree or the smoke test probes an image the build did not produce.
      VERSION:
        sh: "grep -m1 '^version = ' rs/ll-open/cli/Cargo.toml | cut -d'\"' -f2"
      IMAGE_REF: '{{.IMAGE_REF | default (printf "localhost/leyline:v%s" .VERSION)}}'
      PLATFORM: '{{.PLATFORM | default "linux/arm64"}}'
      HOST_PORT: '18384'
    cmds:
      - docker rm -f llo-smoke 2>/dev/null || true
      - |
        # Image CMD already includes --mcp-bind 0.0.0.0 --mcp-allow-public;
        # no override needed. Host publish pinned to 127.0.0.1 so the
        # unauthenticated MCP listener never reaches the LAN — matches the
        # security block in image.Dockerfile.
        docker run -d --rm --name llo-smoke \
          --platform {{.PLATFORM}} \
          -p 127.0.0.1:{{.HOST_PORT}}:8384 \
          {{.IMAGE_REF}}
      # Logic lives in tools/image_smoke.sh, not inline here. It was three
      # near-identical deadline loops embedded in YAML, where shellcheck cannot
      # see them and nothing can test them — the same reasoning that puts the
      # release staging logic in tools/. Extracting it immediately earned its
      # keep: shellcheck flagged an `eval` (SC2016) that YAML had been hiding.
      - >-
        IMAGE_REF={{.IMAGE_REF}} PLATFORM={{.PLATFORM}} HOST_PORT={{.HOST_PORT}}
        tools/image_smoke.sh

  # `image:publish` and `image:verify-published` exist because a well-formed
  # OCI address for an image nobody publishes is WORSE than a malformed one
  # (`ley-line-open-e44960`). cloister derives `<identifier>:<version>` from
  # server.json; when that address 404s it does not fail, it emits
  # "could not resolve an OCI digest — pinning by MUTABLE TAG" and proceeds.
  # v0.11.3 fixed the address shape and thereby turned a loud resolve failure
  # into a warning that flows through.
  #
  # CI supplies only REGISTRY_REF and TAG; the build lives here so the
  # published artifact is the one `task image` produces locally.
  image:publish:
    desc: Build and push the LLO image for one platform to an OCI registry
    vars:
      VERSION:
        sh: "grep -m1 '^version = ' rs/ll-open/cli/Cargo.toml | cut -d'\"' -f2"
      # The registry path WITHOUT tag or digest — cloister ADR-0041's
      # `identifier`. Must equal server.json's packages[0].identifier.
      REGISTRY_REF: '{{.REGISTRY_REF | default "ghcr.io/agentic-research/ley-line-open"}}'
      # `v`-prefixed. ADR-0041 says `version` must match the git tag; the real
      # invariant is that it must match the PUSHED IMAGE TAG, since that is
      # what makes `<identifier>:<version>` resolve. LLO emits `v0.11.3` in
      # server.json (following mache), so an unprefixed push here would
      # reintroduce the unresolvable address this target exists to prevent.
      TAG: '{{.TAG | default (printf "v%s" .VERSION)}}'
      PLATFORM: '{{.PLATFORM | default "linux/arm64"}}'
      ARCH_SUFFIX:
        sh: 'case "{{.PLATFORM | default "linux/arm64"}}" in linux/arm64) echo arm64;; linux/amd64) echo amd64;; *) echo "unsupported PLATFORM" >&2; exit 1;; esac'
    preconditions:
      - sh: 'test "{{.TAG}}" = "v{{.VERSION}}"'
        msg: >-
          TAG ({{.TAG}}) does not match v{{.VERSION}} derived from
          rs/ll-open/cli/Cargo.toml. Publishing under a tag that disagrees with
          the crate version is how server.json's packages[0].version comes to
          name an image that does not exist (ley-line-open-e44960).
    cmds:
      - task: image
        vars:
          IMAGE_REF: '{{.REGISTRY_REF}}:{{.TAG}}-{{.ARCH_SUFFIX}}'
          PLATFORM: '{{.PLATFORM}}'
      - docker push '{{.REGISTRY_REF}}:{{.TAG}}-{{.ARCH_SUFFIX}}'
      - echo "pushed {{.REGISTRY_REF}}:{{.TAG}}-{{.ARCH_SUFFIX}}"

  image:manifest:
    desc: Assemble the multi-arch manifest list from per-arch tags and push it
    vars:
      VERSION:
        sh: "grep -m1 '^version = ' rs/ll-open/cli/Cargo.toml | cut -d'\"' -f2"
      REGISTRY_REF: '{{.REGISTRY_REF | default "ghcr.io/agentic-research/ley-line-open"}}'
      TAG: '{{.TAG | default (printf "v%s" .VERSION)}}'
    cmds:
      # `<identifier>:<version>` — the exact address cloister derives — must
      # resolve to the manifest list, not to one architecture.
      - |
        docker buildx imagetools create \
          -t '{{.REGISTRY_REF}}:{{.TAG}}' \
          '{{.REGISTRY_REF}}:{{.TAG}}-amd64' \
          '{{.REGISTRY_REF}}:{{.TAG}}-arm64'
      - echo "pushed manifest list {{.REGISTRY_REF}}:{{.TAG}}"

  image:verify-published:
    desc: Prove the address server.json advertises actually resolves to a digest
    vars:
      REGISTRY_REF: '{{.REGISTRY_REF | default "ghcr.io/agentic-research/ley-line-open"}}'
    cmds:
      # Reads the ADVERTISED address out of server.json rather than
      # reconstructing it, so this checks the thing consumers actually use.
      # Asserting the manifest resolves is the whole point: the failure this
      # guards is an address that is well-formed and unpullable, which no
      # amount of schema validation can detect.
      - |
        set -eu
        ID=$(jq -r '.packages[0].identifier' server.json)
        VER=$(jq -r '.packages[0].version' server.json)
        if [ -z "$ID" ] || [ "$ID" = "null" ] || [ -z "$VER" ] || [ "$VER" = "null" ]; then
          echo "server.json packages[0] is missing identifier or version" >&2
          exit 1
        fi
        echo "server.json advertises ${ID}:${VER}"
        if ! docker buildx imagetools inspect "${ID}:${VER}" >/dev/null 2>&1; then
          echo "FAIL: ${ID}:${VER} does not resolve." >&2
          echo "cloister will not error on this — it warns and pins the mutable tag." >&2
          exit 1
        fi
        docker buildx imagetools inspect "${ID}:${VER}" --format '{{`{{.Manifest.Digest}}`}}' \
          | sed 's/^/resolved digest: /'

  # --------------------------------------------------------------------------
  # All-in-one
  # --------------------------------------------------------------------------
  compat:gen:
    desc: |
      Regenerate compatibility.json from leyline-cli-lib::daemon::version
      constants. Self-maintaining compat surface (bead ley-line-open-cbea02).
      Run before committing any change to rs/ll-open/cli-lib/src/daemon/version.rs.
    dir: rs
    cmds:
      - cargo run -p compat-gen --quiet > ../compatibility.json
      - echo "regenerated compatibility.json"

  compat:check:
    desc: |
      Verify the committed compatibility.json matches what compat-gen
      would emit today. CI invariant — fails the build on drift. Same
      discipline `clients/go/leyline-schema/regen.sh` uses for Go bindings.
    dir: rs
    cmds:
      - |
        EXPECTED="$(cargo run -p compat-gen --quiet)"
        ACTUAL="$(cat ../compatibility.json)"
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "compatibility.json is stale — run 'task compat:gen' and commit"
          echo "--- diff ---"
          diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
          exit 1
        fi
        echo "compatibility.json is up to date"

  gen:execution-tools:
    desc: |
      Regenerate cli-lib's execution-tools.json from the execution/v1 IDL
      through the tooldefs schema-bridge plugin — the same emitter
      `leyline-schema-bridge`'s execution_v1 conformance test compares
      against. Run after any edit to execution.capnp, including doc
      annotations, which are part of the emitted tool descriptions.

      Without this the only signal is that test failing with "registry
      artifact drifted", which says a regeneration is owed but not how to
      perform one.
    dir: rs
    cmds:
      - |
        set -eu
        out="$(mktemp -d)"
        trap 'rm -rf "$out"' EXIT
        cargo build --quiet -p leyline-schema-bridge \
          --bin capnpc-schema-bridge-tooldefs
        capnp compile \
          -o"$PWD/target/debug/capnpc-schema-bridge-tooldefs:$out" \
          ll-core/schema-spec/execution/v1/execution.capnp
        cp "$out/execution.tools.json" ll-open/cli-lib/src/daemon/execution-tools.json
        echo "regenerated ll-open/cli-lib/src/daemon/execution-tools.json"

  gen:server-json:
    desc: |
      Regenerate server.json from leyline-cli-lib::daemon::mcp
      (tool_registry + cloister_groups). Self-maintaining MCP Registry
      surface (bead ley-line-open-f10abb). Run before committing any
      change to the MCP tool surface or cloister group partitioning.
    dir: rs
    cmds:
      - cargo run -p server-json-gen --quiet > ../server.json
      - echo "regenerated server.json"

  gen:server-json:check:
    desc: |
      Verify the committed server.json matches what server-json-gen
      would emit today. CI invariant — fails the build on drift. Mirrors
      the discipline `compat:check` uses for compatibility.json.
    dir: rs
    cmds:
      - |
        EXPECTED="$(cargo run -p server-json-gen --quiet)"
        ACTUAL="$(cat ../server.json)"
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "server.json is stale — run 'task gen:server-json' and commit"
          echo "--- diff ---"
          diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
          exit 1
        fi
        echo "server.json is up to date"

  readme:version-check:
    desc: |
      Fail if README.md pins a version that doesn't match the leyline-cli
      crate version. Catches the drift pattern where a release bumps
      Cargo.toml + CHANGELOG but leaves `ley-line-open:<old>` strings in
      the README untouched. Single source of truth: rs/ll-open/cli/Cargo.toml.
      (Upstream solution is mache's `drift_doc_outdated_count` smell rule,
      currently a v1 placeholder — bead mache-e1b6c8. Replace this task
      with `mache find_smells --rule drift_doc_outdated_count` when that
      lands.)
    cmds:
      - |
        VERSION="$(grep -m1 '^version = ' rs/ll-open/cli/Cargo.toml | cut -d'"' -f2)"
        if [ -z "$VERSION" ]; then
          echo "could not read version from rs/ll-open/cli/Cargo.toml"
          exit 1
        fi
        STALE="$(grep -E 'ley-line-open:[0-9]+\.[0-9]+\.[0-9]+' README.md | grep -v "ley-line-open:$VERSION" || true)"
        if [ -n "$STALE" ]; then
          echo "README.md pins a version string that doesn't match $VERSION:"
          echo "$STALE"
          echo "→ bump the strings or update rs/ll-open/cli/Cargo.toml"
          exit 1
        fi
        echo "README.md version pins match $VERSION"

  schema:version-check:
    desc: |
      Keep public Rust schema crates aligned with the binary release package
      version. SCHEMA_VERSION names the independently published wire/schema
      surface and is validated, including its Go-client tag, by
      release:version-check and tag_release.sh.
    cmds:
      - |
        BINARY_VERSION="$(grep -m1 '^version = ' rs/ll-open/cli/Cargo.toml | cut -d'"' -f2)"
        if [ -z "$BINARY_VERSION" ]; then
          echo "could not read the binary package version"
          exit 1
        fi
        for manifest in \
          rs/ll-core/schema/Cargo.toml \
          rs/ll-core/public-schema/Cargo.toml \
          rs/ll-core/schema-spec/Cargo.toml \
          rs/ll-core/schema-capnp/Cargo.toml
        do
          PACKAGE_VERSION="$(grep -m1 '^version = ' "$manifest" | cut -d'"' -f2)"
          if [ "$PACKAGE_VERSION" != "$BINARY_VERSION" ]; then
            echo "$manifest is $PACKAGE_VERSION but binary release is $BINARY_VERSION"
            exit 1
          fi
        done
        echo "public Rust schema crates match binary release $BINARY_VERSION"

  ci:
    desc: Common CI gate — runs on every PR. Excludes `test:perf` (release-profile rebuild adds ~90-120s; main-push-only via ci.yml's conditional `test:perf` step). For the full main-push gate locally, run `task ci:full`.
    deps: [cache:sccache:install]
    cmds:
      # Invalidate any older receipt before the first gate. The final command
      # records success only if this exact source/contract snapshot survives
      # the entire run unchanged.
      - tools/ci_attestation.sh begin
      # Compile-free gates first (sub-second): a formatting slip or lint
      # hit fails here instead of after minutes of check+clippy — 3 of 6
      # worktree agents on 2026-07-15 paid a full compile before reaching
      # fmt:check at its old position (bead ley-line-open-9ca974).
      - task: fmt:check
      - task: lint:toolchain-parity
      - task: lint:workflow-parity
      - task: lint:cache-contract
      - task: ci:attestation:fixture-test
      - task: ci:workflow-parity:fixture-test
      - task: mutants:diff:fixture-test
      - task: taskfile:anchors:fixture-test
      - task: release:artifacts:fixture-test
      - task: release:publication:fixture-test
      - task: release:workflow:fixture-test
      - task: release:tags:fixture-test
      - task: release:publish:fixture-test
      - task: release:retry:fixture-test
      - task: schema:consumer-fixture-test
      - task: schema:mcp-protocol-pin-test
      - task: release:version-check
      - task: release:crates:fixture-test
      - task: lint:blake3
      - task: lint:architecture-vocabulary
      - task: lint:doc-claims
      - task: lint:feature-reachability
      - task: lint:mutants-cfg-coverage
      - task: readme:version-check
      - task: schema:version-check
      - task: check
      - task: clippy
      - task: smells
      - task: fs:build:static
      - task: fs:build:nfs-isolated
      - task: fs:test:cdc
      - task: cli-lib:test:cdc-activation
      - task: cli-lib:test:vec
      - task: cli-lib:test:text-search
      - task: tier:isolation
      - task: check:all-features
      - task: test
      - task: sign:host:build
      - task: sign:host:test
      - task: compat:check
      - task: gen:server-json:check
      - tools/ci_attestation.sh finish

  ci:full:
    desc: Full CI pipeline including the release-profile perf regression gate. Runs on main pushes via ci.yml's conditional step; available locally via `task ci:full` for pre-push validation.
    cmds:
      - task: ci
      - task: test:perf
