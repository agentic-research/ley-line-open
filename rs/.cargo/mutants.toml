# cargo-mutants adjudication.
#
# This file records mutants that survive for a reason OTHER than missing test
# coverage. It is deliberately hard to add to: a surviving mutant is a missing
# assertion until proven otherwise, and "proven otherwise" means the entry
# below states why no test could ever kill it.
#
# It is not an ignore list. Nothing here is "we'll get to it" — that belongs in
# a bead with the gate left red. Every entry must be an EQUIVALENT MUTANT: a
# mutation that produces a program behaviourally indistinguishable from the
# original, so there is no observable difference for a test to assert on.
#
# Adding an entry that is merely inconvenient to test defeats the gate. The
# three other survivors found on this branch were all "inconvenient to test" —
# a `setpgid` that will not fail, an `EINTR` that cannot be scheduled — and
# each was fixed by making the failure injectable
# (`configure_process_group_with`, `retry_while_interrupted`) rather than
# listed here.

exclude_re = [
    # `observe_exit` passes `libc::WEXITED | libc::WNOWAIT` to `waitid`.
    #
    # Those two constants are disjoint bit flags — on Linux 0x00000004 and
    # 0x01000000, on macOS 0x00000004 and 0x00000020 — and for operands with
    # no bits in common, `a | b` and `a ^ b` produce the identical integer.
    # The mutated program is therefore not merely hard to distinguish from the
    # original; it is the same program, and passes the same flags to the same
    # syscall.
    #
    # No restructuring changes this. Hoisting the expression to a `const` only
    # relocates the mutant, and writing it as `WEXITED + WNOWAIT` would trade a
    # true statement for one that silently breaks the day the flags overlap.
    # The bitwise-or is the correct expression; the mutation operator simply
    # has no semantic target here.
    'process\.rs.*replace \| with \^ in observe_exit',

    # `KRUN_TSI_HIJACK_INET = 1 << 0`, mutated to `1 >> 0`.
    #
    # Shifting by zero is the identity in both directions, so `1 << 0` and
    # `1 >> 0` are the same integer — the mutated program is not merely hard to
    # distinguish from the original, it IS the original. No test can observe a
    # difference because there is none.
    #
    # Writing the constant as a literal `1` would relocate the mutant rather
    # than remove it, and would lose the `1 << bit` shape that says this is a
    # flag mask from `libkrun.h` rather than an arbitrary number. The shift is
    # the correct expression; the operator has no semantic target at
    # shift-distance zero.
    # The constant lives in libkrun/plan.rs, beside `KrunConfig.tsi_features`
    # (bead ley-line-open-395e43); it is plan.rs's only shift.
    'plan\.rs.*replace << with >>',

    # `let chunk_rows = chunk_files * ROWS_PER_FILE_EST;` feeding
    # `Vec::with_capacity(chunk_rows)` for the per-chunk row buffers, mutated
    # to `+` or `/`.
    #
    # The value is a capacity HINT and nothing else. `Vec::with_capacity(n)`
    # and `Vec::with_capacity(m)` produce vectors that are equal for every
    # operation the program performs on them — same elements, same order, same
    # length, same iteration, same flush. A wrong hint changes how many times
    # the allocator is asked to grow, which is a performance property with no
    # observable behavioural difference to assert on. Every row still lands,
    # which is exactly what `chunked_pipeline_projects_identically_*` and the
    # F-gates check.
    #
    # This is NOT "inconvenient to test". `Vec::capacity()` is technically
    # readable, but asserting on it would pin an allocator hint rather than a
    # behaviour, and would have to be rewritten every time the per-file row
    # estimate is retuned — the assertion would encode the implementation it is
    # supposed to be independent of.
    #
    # Restructuring does not remove the mutant either: hoisting the product to
    # a const or a helper relocates it, and writing the estimate as a single
    # baked-in number would lose the `files × rows_per_file` shape that says
    # why the number is what it is.
    'cmd_parse\.rs.*replace \* with (\+|/) in parse_into_conn',

    # projection-v5 nid composition in `leyline-schema`'s two encoders:
    # `file_nid`'s `(file_id << NID_ORDINAL_BITS) | ordinal` and
    # `file_nid_range`'s `lo | NID_ORDINAL_MASK`, each mutated `| -> ^`.
    #
    # This is the `WEXITED | WNOWAIT` case above, with the disjointness
    # enforced by the encoding rather than inherited from libc. The left
    # operand is `file_id << NID_ORDINAL_BITS`, so its low 24 bits are zero by
    # construction, and the right operand lives entirely in those 24 bits:
    # `NID_ORDINAL_MASK` itself, or an ordinal that `file_nid`'s
    # `debug_assert!` bounds by it and that every minting caller checks with an
    # `ensure!` first (`parse_into_conn`, the standalone projector's
    # `walk_children`). For operands with no bits in common `a | b` and
    # `a ^ b` are the identical integer, so the mutated program mints the same
    # nids, writes the same rows, and folds to the same Σ root.
    #
    # This is NOT "inconvenient to test". A test that could distinguish them
    # would need an ordinal whose bits reach into the file_id field — the state
    # those `ensure!`s exist to make unreachable; asserting on it would assert
    # that nids may collide across files.
    #
    # These entries used to name the `base | ordinal` sites in
    # `parse_into_conn` and `walk_children`. Bead `ley-line-open-12e252` typed
    # nids (`leyline_schema::Nid`), and those sites now step within a file's
    # range through `Nid + ordinal`, whose `+` mutants are killed by the
    # schema crate's tests; the `|` lives only here. The sibling `| -> &` is a
    # real behavioural change (it clears a field) and is NOT listed.
    'schema/src/lib\.rs.*replace \| with \^ in (file_nid|file_nid_range)',
    # `verify_head`'s `kid_hit` fast path, mutated two ways: `delete !` on
    # `!kid.is_empty()`, and `==` -> `!=` on the canonical-kid comparison.
    #
    # Both are equivalent, and for the same one-line reason. The verdict is
    #
    #     if kid_hit || trusted.iter().any(&verifies) { Valid } else { Invalid }
    #
    # and `kid_hit` IMPLIES the right-hand disjunct: `kid_hit` can only be true
    # if some key drawn from `trusted` satisfied `verifies`, and that same key
    # makes `trusted.iter().any(&verifies)` true. A disjunct that implies its
    # neighbour cannot change the disjunction. So `kid_hit || any` is
    # `any` for every input, and ANY mutation of how `kid_hit` is computed
    # leaves the verdict identical.
    #
    # Neither mutation escapes that. Both only change WHICH trusted keys the
    # filter admits — the iterator is over `trusted` either way, and `.any(&
    # verifies)` still demands a real signature verification, so neither can
    # make `kid_hit` true without a key that would have verified anyway.
    # `verify_head` returns the verdict and nothing else, and `verifies` is a
    # pure closure over `RootSigner::verify`, so there is no other channel to
    # observe.
    #
    # This is the R1 property the code comment above the expression states
    # outright: "kid only *orders* the attempt ... kid is never the sole
    # selector." A spoofed or absent kid can neither admit an untrusted signer
    # nor exclude a trusted one. Mutation testing cannot see an ordering
    # optimisation, and a test that could distinguish these would be asserting
    # that kid IS load-bearing — the opposite of the security property.
    #
    # NOT "inconvenient to test": there is no behavioural difference to assert
    # on. Restructuring does not help either — collapsing the fast path away
    # would remove the mutants by removing the optimisation, and hoisting it
    # into a helper only relocates them.
    'root_signer\.rs.*(delete ! in verify_head|replace == with != in verify_head)',

    # The host FUSE adapter's flag translations (storefs `host/fuse_abi.rs`,
    # bead `ley-line-open-3e73dc`), each `|` (or `|=`) mutated to `^` (`^=`).
    #
    # The `observe_exit` case again: every operand pair is disjoint by
    # construction. `linux_open_flags` ors the access mode — `host &
    # O_ACCMODE`, bits 0o3 — with Linux `O_TRUNC`, 0o1000. In
    # `macos_rename_flags`, `RENAME_SWAP | RENAME_EXCL` is 0x2 and 0x4, and
    # `linux` starts at 0 and takes `RENAME_NOREPLACE` (0x1),
    # `RENAME_EXCHANGE` (0x2) and `UNKNOWN_RENAME_FLAG` (1 << 31) at most once
    # each. For operands with no bits in common `a | b` and `a ^ b` are the
    # same integer, so the mutated function returns the same flags for every
    # input; there is no difference to assert on.
    #
    # Writing them as `+` would trade a true statement for one that breaks the
    # day two flags overlap; the bitwise-or is the correct expression. The
    # sibling mutations (`| -> &`, `&= / |=` swaps, `!= -> ==`) change the
    # result and are killed by `host_open_flags_reach_the_filesystem_in_linux_values`
    # and `macos_rename_flags_reach_the_filesystem_in_linux_values`.
    'fuse_abi\.rs.*replace (\| with \^|\|= with \^=) in (linux_open_flags|macos_rename_flags)',

    # The scratch directory's open flags (storefs `derived.rs` and the
    # scratch paths of `lib.rs`, bead `ley-line-open-39998b`), each `|`
    # mutated to `^`.
    #
    # The `observe_exit` case again, with the disjointness stated in the
    # code. `openat_mode` ors the caller's flags with `O_NOFOLLOW` and
    # `O_CLOEXEC`, and `open_path` with `O_CLOEXEC`; each `debug_assert`s
    # that the caller's flags carry neither, and no caller passes them.
    # `rename_into_scratch` opens with `O_WRONLY | O_CREAT | O_EXCL` and
    # `open_scratch` adds `O_CREAT | O_EXCL` to an access mode of `O_RDWR`
    # or `O_RDONLY`: distinct single-bit flags (and a two-bit access mode)
    # with no bit in common. For operands with no bits in common `a | b`
    # and `a ^ b` are the same integer, so the mutated program passes the
    # same flags to the same syscalls.
    #
    # The sibling `| -> &` mutations change the flags and are killed:
    # `a_symlink_is_never_followed_at_the_last_component_or_on_the_way`
    # (`O_NOFOLLOW`), `the_root_and_every_opened_file_are_close_on_exec`
    # (`O_CLOEXEC`), and the create tests (`O_CREAT`).
    'derived\.rs.*replace \| with \^ in (openat_mode|open_path)',
    'storefs/src/lib\.rs.*replace \| with \^ in StoreFs<S>::(rename_into_scratch|open_scratch)',

    # The control block lease's `try_flock` (bead `ley-line-open-feabf4`),
    # `how | LOCK_NB` mutated to `^`.
    #
    # The `observe_exit` case again. Every caller passes `LOCK_SH` or
    # `LOCK_EX` as `how`; `flock(2)`'s operation bits are distinct single
    # bits (1, 2, 4, 8 for SH, EX, NB, UN on Linux and macOS), so `how` and
    # `LOCK_NB` share no bit and `a | b == a ^ b`: the mutated program passes
    # the same operation to the same syscall. The sibling `| -> &` mutation
    # yields 0, an invalid operation, and is killed by every lease test.
    'control_lease\.rs.*replace \| with \^ in try_flock',
]
