# cargo-mutants adjudication.
#
# This file records mutants that survive for a reason OTHER than missing test
# coverage. It is deliberately hard to add to: a surviving mutant is a missing
# assertion until proven otherwise, and "proven otherwise" means the entry
# below states why no test could ever kill it.
#
# It is not an ignore list. Nothing here is "we'll get to it" — that belongs in
# a bead with the gate left red. Every entry must be an EQUIVALENT MUTANT: a
# mutation that produces a program behaviourally indistinguishable from the
# original, so there is no observable difference for a test to assert on.
#
# Adding an entry that is merely inconvenient to test defeats the gate. The
# three other survivors found on this branch were all "inconvenient to test" —
# a `setpgid` that will not fail, an `EINTR` that cannot be scheduled — and
# each was fixed by making the failure injectable
# (`configure_process_group_with`, `retry_while_interrupted`) rather than
# listed here.

exclude_re = [
    # `observe_exit` passes `libc::WEXITED | libc::WNOWAIT` to `waitid`.
    #
    # Those two constants are disjoint bit flags — on Linux 0x00000004 and
    # 0x01000000, on macOS 0x00000004 and 0x00000020 — and for operands with
    # no bits in common, `a | b` and `a ^ b` produce the identical integer.
    # The mutated program is therefore not merely hard to distinguish from the
    # original; it is the same program, and passes the same flags to the same
    # syscall.
    #
    # No restructuring changes this. Hoisting the expression to a `const` only
    # relocates the mutant, and writing it as `WEXITED + WNOWAIT` would trade a
    # true statement for one that silently breaks the day the flags overlap.
    # The bitwise-or is the correct expression; the mutation operator simply
    # has no semantic target here.
    'process\.rs.*replace \| with \^ in observe_exit',

    # `KRUN_TSI_HIJACK_INET = 1 << 0`, mutated to `1 >> 0`.
    #
    # Shifting by zero is the identity in both directions, so `1 << 0` and
    # `1 >> 0` are the same integer — the mutated program is not merely hard to
    # distinguish from the original, it IS the original. No test can observe a
    # difference because there is none.
    #
    # Writing the constant as a literal `1` would relocate the mutant rather
    # than remove it, and would lose the `1 << bit` shape that says this is a
    # flag mask from `libkrun.h` rather than an arbitrary number. The shift is
    # the correct expression; the operator has no semantic target at
    # shift-distance zero.
    'api\.rs.*replace << with >>',

    # `let chunk_rows = chunk_files * ROWS_PER_FILE_EST;` feeding
    # `Vec::with_capacity(chunk_rows)` for the per-chunk row buffers, mutated
    # to `+` or `/`.
    #
    # The value is a capacity HINT and nothing else. `Vec::with_capacity(n)`
    # and `Vec::with_capacity(m)` produce vectors that are equal for every
    # operation the program performs on them — same elements, same order, same
    # length, same iteration, same flush. A wrong hint changes how many times
    # the allocator is asked to grow, which is a performance property with no
    # observable behavioural difference to assert on. Every row still lands,
    # which is exactly what `chunked_pipeline_projects_identically_*` and the
    # F-gates check.
    #
    # This is NOT "inconvenient to test". `Vec::capacity()` is technically
    # readable, but asserting on it would pin an allocator hint rather than a
    # behaviour, and would have to be rewritten every time the per-file row
    # estimate is retuned — the assertion would encode the implementation it is
    # supposed to be independent of.
    #
    # Restructuring does not remove the mutant either: hoisting the product to
    # a const or a helper relocates it, and writing the estimate as a single
    # baked-in number would lose the `files × rows_per_file` shape that says
    # why the number is what it is.
    'cmd_parse\.rs.*replace \* with (\+|/) in parse_into_conn',
]
