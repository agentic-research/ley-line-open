[package]
name = "leyline-core"
version = "0.28.0"
edition = "2024"
description = "Σ substrate core for ley-line: BLAKE3 content addressing, the BlobStore contract, arena layout and mmap primitives, and the incremental outboard hash tree"
repository = "https://github.com/agentic-research/ley-line-open"
license = "AGPL-3.0-or-later"

[dependencies]
parking_lot = { workspace = true }
anyhow = { workspace = true }
memmap2 = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
# T2.2: BLAKE3 for σ(arena buffer) computed at snapshot time. Locked
# to BLAKE3 per Σ §3.4 (decade write-up 2026-merkle-cas-substrate.md).
blake3 = { workspace = true }
# The one verify-on-read reader of `source_blobs` (`source_blob`, bead
# ley-line-open-12d305), behind `sqlite` so crates without SQLite do not
# link it.
rusqlite = { workspace = true, optional = true }

# statvfs: a grown arena is refused when the filesystem cannot hold it
# (bead ley-line-open-8c8ded).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
interrupt = []
sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile = { workspace = true }
# Fold-law properties over `PartitionSpec::address` (bead ley-line-open-80f037 F10).
proptest = "1.8"
# The Σ axiom suite reads the checked-in known-answer vectors
# (`schema-spec/sigma/v1/test-vectors/constructions.json`, bead ley-line-open-10d71a).
serde_json = { workspace = true }
