[package]
name = "leyline-mcp-descriptor"
version = "0.11.3"
edition = "2024"
license = "Apache-2.0"
description = "MCP Registry server.json emitter — validates tool/group coverage, then renders. Shared by every ART producer so the coverage invariants are not reimplemented per repo."
repository = "https://github.com/agentic-research/ley-line-open"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
