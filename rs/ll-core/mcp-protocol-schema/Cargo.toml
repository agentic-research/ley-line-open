[package]
name = "leyline-mcp-protocol-schema"
version = "0.14.0"
edition = "2024"
license = "Apache-2.0"
description = "MCP wire-protocol facts generated at build time from a digest-pinned schema (ley-line-open-60f0d3). The digest gate fails compilation, not a test; every exported constant derives from the verified bytes."
repository = "https://github.com/agentic-research/ley-line-open"
publish = false

[lib]
name = "leyline_mcp_protocol_schema"
path = "src/lib.rs"

[build-dependencies]
# The build-time gate + generator: sha2 verifies the vendored bytes
# (compilation fails on mismatch), serde_json extracts the method
# constants from the verified document. See build.rs.
serde_json = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
# Validates the vendored schema compiles as JSON Schema and, in the
# negative-case test, actually rejects a malformed JSON-RPC message.
# Dev-only: this crate ships no runtime code, only the pin + its gate
# (ley-line-open-60f0d3).
jsonschema = "0.33"
serde_json = { workspace = true }
# Re-derives the pinned digest from the vendored bytes at test time —
# same pattern as leyline-schema-spec's verify_vectors_sha256.rs.
sha2 = "0.11"
