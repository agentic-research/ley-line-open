[package]
name = "leyline-schema"
version = "0.19.0"
edition = "2024"
description = "Canonical nodes-table schema shared by the ley-line crates — one definition of the SQLite contract that writers project into and leyline-fs reads, no drift"
repository = "https://github.com/agentic-research/ley-line-open"
license = "Apache-2.0"

[dependencies]
rusqlite = { workspace = true, features = ["bundled", "serialize"] }
anyhow = { workspace = true }
