version: '3'

# Crate-scoped tasks for `leyline-cli-lib`.
#
# Included by the root Taskfile under the `cli-lib:` namespace, so these run as
# `task cli-lib:test:vec`. Tasks belong beside the crate they exercise; the root
# Taskfile carries only repo-wide orchestration.
#
# `dir:` is set per task rather than at file level because these shell out to
# cargo, which must run from the workspace root at `rs/`. Paths here are
# relative to THIS file, so `../../..` is the repo root and `../../../rs` is the
# cargo workspace.
#
# NOTE for anyone adding a task here that the `ci` chain invokes: the coverage
# half of `tools/check_feature_reachability.sh` discovers `cargo test
# --features` lines by asking `task --summary`, which resolves includes. It does
# NOT parse Taskfiles textually — an earlier cut did, and would have silently
# reported these features as uncovered the moment they moved out of the root
# file. Adding a task here is safe; adding one that greps for it is not.

tasks:
  test:
    desc: Run the default CLI library and integration test suite
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo test -p leyline-cli-lib

  test:hostile-hooks:
    desc: Prove the cli-lib tests that commit in throwaway repos ignore the developer's global git hooks
    dir: '{{.TASKFILE_DIR}}/../../..'
    cmds:
      - tools/test_fixture_hooks.sh --rust

  test:vec:
    desc: Tests for the `vec` feature (sqlite-vec + fastembed) — ships in install:full
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo test -p leyline-cli-lib --features vec

  test:text-search:
    desc: Tests for the `text-search` feature (witchcraft) — ships in install:full
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo test -p leyline-cli-lib --features text-search

  test:mount:
    desc: |
      Tests for the `mount` feature (FUSE/NFS) — ships in install:full+mount.
      Mounts a parsed projection over FUSE and reads it back (bead
      ley-line-open-aed167). Needs libfuse (Linux, from deps:ci) or fuse-t
      (macOS) at RUN time, not only at link time; there is no skip path.
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo test -p leyline-cli-lib --features mount --test mount_round_trip

  # The binary, end to end: tools/cli_smoke.sh runs parse, verify-head,
  # splice, and the daemon's socket ops and SIGTERM shutdown on a fixture
  # tree. `smoke` builds what release.yml ships (default features);
  # `smoke:mount` adds the mount and a write through it. `smoke:bin` runs the
  # script on an already-built binary — release.yml calls it per target.
  # `smoke:dev` is the `ci` gate: debug builds, both modes, on every PR and
  # every local `task ci` — the same runners `test:mount` already mounts on.
  smoke:dev:
    desc: Debug-build the CLI and smoke it end to end, default features then with the mount (the `ci` gate)
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo build -p leyline-cli
      - ../tools/cli_smoke.sh target/debug/leyline
      - cargo build -p leyline-cli --features mount
      - ../tools/cli_smoke.sh target/debug/leyline --mount

  smoke:
    desc: Build the release CLI with default features and smoke it end to end
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo build --release -p leyline-cli
      - ../tools/cli_smoke.sh target/release/leyline

  smoke:mount:
    desc: Build the release CLI with `mount` and smoke it, including a write through the mount (needs FUSE/fuse-t)
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo build --release -p leyline-cli --features mount
      - ../tools/cli_smoke.sh target/release/leyline --mount

  smoke:bin:
    desc: Smoke an already-built leyline binary (BIN, relative to the repo root)
    requires:
      vars: [BIN]
    dir: '{{.TASKFILE_DIR}}/../../..'
    cmds:
      - tools/cli_smoke.sh "{{.BIN}}"

  test:cdc-activation:
    desc: CDC activation + the disabled-build counterpart — both halves of the cdc feature gate
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      # The `cdc`-enabled half.
      - cargo test -p leyline-cli-lib --no-default-features --features cdc --test cdc_command_test --test cdc_activation_consumer_test
      # The DISABLED half. Both run: a feature gate is only proven when the
      # off-path is exercised too, otherwise "cdc works" says nothing about what
      # a build without it does.
      - cargo test -p leyline-cli-lib --no-default-features --test cdc_disabled_command_test
