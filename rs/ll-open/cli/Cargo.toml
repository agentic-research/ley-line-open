[package]
name = "leyline-cli"
version = "0.27.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[[bin]]
name = "leyline"
path = "src/main.rs"

[features]
# Match cli-lib's baseline defaults — lsp + validate + hdc + cdc are pure-Rust
# with no system-dep cost, and cli-lib treats them as always-available.
# `mount`, `fuse` (libfuse-t/libfuse system dep) and `vec` (fastembed +
# ONNX download at first use) stay opt-in to keep the default build portable.
default = ["lsp", "validate", "hdc", "cdc", "sheaf"]
lsp = ["leyline-cli-lib/lsp"]
# `daemon --mount` over NFS (`--backend nfs`): a loopback NFSv3 server and
# the kernel's own NFS client. Pure Rust; links no system library.
mount = ["leyline-storefs/mount"]
# `--backend fuse` as well (bead ley-line-open-9d4712): links libfuse —
# fuse-t on macOS (`brew install fuse-t`, PKG_CONFIG_PATH=rs/pkgconfig, as
# the Taskfile sets it), libfuse-dev on Linux — at build time and at launch:
# a binary built with it does not start without the library, even for
# non-mount commands. Linux's default backend is FUSE, so a Linux `--mount`
# without `--backend nfs` needs this feature.
fuse = ["mount", "leyline-storefs/fuse"]
vec = ["leyline-cli-lib/vec"]
validate = ["leyline-cli-lib/validate"]
hdc = ["leyline-cli-lib/hdc"]
text-search = ["leyline-cli-lib/text-search"]
cdc = ["leyline-cli-lib/cdc"]
# The sheaf_* and agreement daemon ops mache's cascade calls (bead
# ley-line-open-39e239); default-on like the other daemon-op surfaces.
sheaf = ["leyline-cli-lib/sheaf"]
# Meta-feature — every daemon op the CLI can expose, without the host
# mount. Use for `task install:full` or
# `cargo build -p leyline-cli --features all`. Add `mount` for an NFS mount
# with no system-dep requirement (`--features all,mount`).
#
# For a build that includes both mount backends, use `full`:
#   cargo build -p leyline-cli --features full
# or `task install:full+mount` — `fuse` needs libfuse-t (macOS
# `brew install fuse-t`) or libfuse-dev (Linux) at build time and launch.
all = ["lsp", "vec", "validate", "hdc", "text-search", "cdc", "sheaf"]
# Everything, including both mount backends. Requires libfuse-t / libfuse.
full = ["lsp", "mount", "fuse", "vec", "validate", "hdc", "text-search", "cdc", "sheaf"]

[dependencies]
leyline-cli-lib = { path = "../cli-lib", default-features = false }
# Supervises the krun worker; the VMM is the leyline-krun-worker crate's.
leyline-runtime = { path = "../runtime", default-features = false }
# Serves a microVM run's granted workspace from the daemon's store
# (ADR-0044 V5): DaemonShares and the StoreShare adapter.
leyline-storefs = { path = "../storefs" }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
dirs = "6"
env_logger = "0.11"
libc = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
# tests/agent_in_guest.rs: builds the execution/v1 RunSpec and RunGrant a
# caller sends, and the guest rootfs manifest.
blake3 = { workspace = true }
capnp = { workspace = true }
capnp-json = { workspace = true }
leyline-public-schema = { path = "../../ll-core/public-schema" }
# tests/execution_evidence.rs: signs the RunGrants and DSSE evidence the
# daemon's --trust-key verifier checks.
leyline-envelope = { path = "../envelope" }
# tests/agent_in_guest.rs (d): reads the daemon's `_parse_diagnostics` row
# for the half-written file the guest saved (ADR-0045 T3).
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
