[package]
name = "leyline-fs"
version = "0.20.3"
edition = "2024"
description = "SQLite-backed content-addressed filesystem for ley-line — FUSE/NFS materialize-on-read, chunk-backed (CDC) range reads, transactional GC, and the nodes-table graph"
repository = "https://github.com/agentic-research/ley-line-open"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["validate", "fuse", "nfs"]
validate = [
    "dep:tree-sitter",
    "dep:tree-sitter-go",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-elixir",
]
fuse = ["dep:fuser", "dep:libc"]
nfs = ["dep:nfsserve", "dep:libc"]
splice = ["dep:leyline-ts"]
# Chunk-backed content storage (ADR-0026 at chunk granularity): the SQL
# projection stores a chunk MANIFEST instead of whole file bytes, so a range
# read selects only overlapping chunks. Opt-in so the lean mount build is
# unchanged.
cdc = ["dep:leyline-cdc"]
# Verify-on-fault arena serving (bead ley-line-open-b6a4dd): keep the arena
# mapped, hold the outboard BLAKE3 tree beside it, and verify each 1 KiB page
# against `ctrl.current_root` the first time it is served (bitmap-cached, so
# the steady state re-hashes nothing). Opt-in AND runtime-activated
# (`HotSwapGraph::with_verify_on_fault`); default mounts are unchanged, and
# the flag flips into a shipping config in a later bead.
verify = []

[dependencies]
parking_lot = { workspace = true }
leyline-core = { path = "../../ll-core/core", version = "0.20.3" }
# Shared C-boundary helpers (bead `ley-line-open-85fb1f` PR 2).
leyline-ffi-helpers = { path = "../../ll-core/ffi-helpers", version = "0.20.3" }
leyline-schema = { path = "../../ll-core/schema", version = "0.20.3" }
anyhow = { workspace = true }
memmap2 = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
# T2.3: BLAKE3 to verify σ(arena buffer) == ctrl.current_root before
# deserialize. Locked to BLAKE3 per Σ §3.4.
blake3 = { workspace = true }
# `features = ["libfuse"]` is REQUIRED, not incidental. fuser 0.16 changed its
# default feature set from `["libfuse"]` to `[]`, which silently switches the
# mount implementation to the pure-Rust one — and that is Linux-only, so a
# macOS build fails in fuser's build.rs with "Building without libfuse is only
# supported on Linux". Restoring it explicitly keeps 0.15's behaviour (libfuse2
# via the fuse-t wrapper in rs/pkgconfig on macOS, libfuse3 on Linux).
#
# Bumped 0.15 -> 0.16 for GHSA-cvmj-47v9-35m9 (high): uninitialized memory read
# and leak in fuser < 0.16.0.
fuser = { version = "0.16", optional = true, features = ["libfuse"] }
libc = { workspace = true, optional = true }
log = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "serialize"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# nfsserve 0.11.0 plus a COMMIT procedure, a WRITE that reports the stability
# it achieved, and AUTH_UNIX credentials (bead 3c4893). Upstream nfsserve
# answers every WRITE FILE_SYNC and has no COMMIT, so a server cannot tell
# when a client's write is finished. Pinned exactly: the fork has one
# publisher, and its diff against upstream 0.11.0 was read before it was
# taken; a new version gets the same reading.
nfsserve = { package = "nessie-nfsserve", version = "=0.3.1", optional = true }
crossbeam-queue = "0.3"
async-trait = "0.1"
# `time` + `macros`: the NFS server's idle committer (`nfs::Staged`).
tokio = { workspace = true, features = ["net", "time", "macros"] }
tree-sitter = { workspace = true, optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
leyline-ts = { path = "../ts", version = "0.20.3", optional = true }
leyline-cdc = { path = "../cdc", version = "0.20.3", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
leyline-ts = { path = "../ts" }
# `hooks` enables `Connection::commit_hook`, which lets the activation-batching
# test COUNT commits instead of timing them. A wall-clock assertion on the same
# property would be flaky and would not say why it regressed; a commit count is
# exact and names the defect directly. Dev-only — production never links it.
rusqlite = { workspace = true, features = ["bundled", "serialize", "hooks"] }

# The F4c/F5c storage gate (bead `ley-line-open-b5faa9`). Needs `cdc` for the
# activation + GC surface it measures, and nothing else — `--no-default-
# features` keeps it off the FUSE/NFS toolchain so it runs anywhere a
# projection does.
[[example]]
name = "cdc_storage_bound"
required-features = ["cdc"]

# Cross-generation churn: what a one-commit diff costs CDC under each target
# (bead `ley-line-open-b5faa9`). Companion to `cdc_storage_bound`, which
# measured within one generation only.
[[example]]
name = "cdc_churn"
required-features = ["cdc"]
