[package]
name = "leyline-runtime"
version = "0.16.0"
edition = "2024"
description = "Capability-resolved execution lifecycle and isolation backends for Leyline"
repository = "https://github.com/agentic-research/ley-line-open"
license = "AGPL-3.0-or-later"

[dependencies]
blake3 = { workspace = true }
capnp = { workspace = true }
capnp-json = { workspace = true }
leyline-public-schema = { path = "../../ll-core/public-schema", version = "0.16.0" }
libloading = { workspace = true }
libc = { workspace = true }
leyline-core = { path = "../../ll-core/core", version = "0.16.0" }
leyline-envelope = { path = "../envelope", version = "0.16.0" }
nono = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rustix = { version = "1.1.4", features = ["fs"] }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
wait-timeout = "0.2"
