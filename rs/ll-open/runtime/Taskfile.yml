version: '3'

# Crate-scoped tasks for the embedded execution runtime. Included by the root
# Taskfile under the `runtime:` namespace; the root keeps compatibility aliases
# while this file owns the actual cargo invocation and local environment.

tasks:
  test:
    desc: >-
      Run embedded execution runtime tests (fake-worker contracts and the
      linked libkrun without a hypervisor), then the agent-in-guest
      end-to-end test (leyline-cli, tests/agent_in_guest.rs). Set
      LEYLINE_LIBKRUNFW_PATH to libkrunfw to also boot real guests, and
      LEYLINE_GUEST_TOOLS to the rootfs tools/guest_tools.sh writes for the
      end-to-end test; LEYLINE_REQUIRE_HYPERVISOR makes their absence fail
      instead of skip.
    dir: '{{.TASKFILE_DIR}}/../..'
    env:
      # Local developer toolchains commonly configure sccache globally. The
      # restricted runtime/UDS test harness cannot use that daemon reliably;
      # CI and local Taskfile invocation therefore share the direct rustc path.
      RUSTC_WRAPPER: ''
    cmds:
      - cargo test -p leyline-runtime
      # The worker crate links the vendored libkrun and builds the
      # leyline-krun-worker binary (bead ley-line-open-395e43).
      - cargo test -p leyline-krun-worker
      # Builds on the worker binary the line above built.
      - cargo test -p leyline-cli --test agent_in_guest
      # The recorded run (`task release:hypervisor:record` sets
      # LEYLINE_REQUIRE_HYPERVISOR=1) also provisions a real CAS volume, so
      # the release receipt covers hdiutil, not only its fakes (bead
      # ley-line-open-1665c9).
      - task: test:cas-volume:required

  test:cas-volume:required:
    internal: true
    platforms: [darwin]
    status:
      - '[ "${LEYLINE_REQUIRE_HYPERVISOR:-}" != 1 ]'
    cmds:
      - task: test:cas-volume

  test:cas-volume:
    desc: >-
      Provision real case-sensitive CAS volumes with /usr/bin/hdiutil and run
      the daemon's provision over its socket (LEYLINE_CAS_VOLUME_TESTS=1):
      create, attach, re-attach, the nodev/nosuid mount flags, the attached
      image matched to cas.sparsebundle, and the pinned hdiutil deprecation
      warnings. macOS only, unprivileged; each test detaches its volume.
      Set LEYLINE_OCI_ACCEPTANCE_DIR to also import the first-party images.
      `task runtime:test` runs this when LEYLINE_REQUIRE_HYPERVISOR=1, which
      `task release:hypervisor:record` sets, so its receipt covers it.
    dir: '{{.TASKFILE_DIR}}/../..'
    platforms: [darwin]
    env:
      RUSTC_WRAPPER: ''
      LEYLINE_CAS_VOLUME_TESTS: '1'
    cmds:
      - cargo test -p leyline-runtime --test cas_volume
      - cargo test -p leyline-cli --test execution_cas_volume

  broker-macos:
    desc: >-
      The connection broker's macOS evidence (ADR-0046 Slice 1 S11, S11a; beads
      ley-line-open-52b5b3, ley-line-open-52deb4): the confined broker binary
      relays under its profile (the positive control) and the profile refuses
      every undeclared port, file, exec, fork and the resolver; the loopback
      probe measures per-address scoping against its pinned table; plus the
      portable broker suites. LEYLINE_REQUIRE_SANDBOX=1, so a host that cannot
      apply the profile fails by name instead of reporting a skip. The same
      target runs locally and in ci.yml's macos-latest job.
    platforms: [darwin]
    dir: '{{.TASKFILE_DIR}}/../..'
    env:
      RUSTC_WRAPPER: ''
      LEYLINE_REQUIRE_SANDBOX: '1'
    cmds:
      - >-
        cargo test -p leyline-runtime --test broker_profile --test broker_loopback_probe
        --test broker_control --test broker_relay --test broker_preflight --test broker_registry
        -- --nocapture

  broker-probe:
    desc: >-
      The loopback probe on Linux (ADR-0046 S11a, bead ley-line-open-52deb4):
      once on the host network, then in a fresh network namespace with IPv6
      disabled, where ::1 must read unavailable (an unavailable row is never a
      pass). Records the Landlock ABI. Needs passwordless sudo for
      `unshare --net`; ci.yml's ubuntu job runs it after `task ci`.
    platforms: [linux]
    dir: '{{.TASKFILE_DIR}}/../..'
    env:
      RUSTC_WRAPPER: ''
      LEYLINE_REQUIRE_SANDBOX: '1'
    cmds:
      - cargo test -p leyline-runtime --test broker_loopback_probe -- --nocapture
      - |
        set -eu
        # The artifact's absolute path from cargo's JSON messages: immune to
        # CARGO_TERM_COLOR and to a relative or absolute CARGO_TARGET_DIR.
        bin=$(cargo test -p leyline-runtime --test broker_loopback_probe --no-run \
          --message-format=json \
          | sed -n 's/.*"executable":"\([^"]*broker_loopback_probe[^"]*\)".*/\1/p' | tail -n 1)
        test -x "$bin" || { echo "broker-probe: cannot find the probe test binary" >&2; exit 1; }
        log=$(mktemp)
        sudo unshare --net sh -c "
          ip link set lo up &&
          sysctl -qw net.ipv6.conf.all.disable_ipv6=1 net.ipv6.conf.default.disable_ipv6=1 net.ipv6.conf.lo.disable_ipv6=1 &&
          LEYLINE_PROBE_NO_IPV6=1 LEYLINE_REQUIRE_SANDBOX=1 '$bin' --exact the_loopback_table_matches_this_platform --nocapture" \
          | tee "$log"
        # A skip or a filtered-out run exits 0 too: require the test to have
        # run and the namespace to have shown its ::1 row as unavailable.
        grep -q '^test result: ok\. 1 passed' "$log" \
          || { echo "broker-probe: the namespace run did not pass exactly one test" >&2; exit 1; }
        grep -q '^  ::1 unavailable$' "$log" \
          || { echo "broker-probe: the namespace run did not record ::1 unavailable" >&2; exit 1; }
        rm -f "$log"

  oci-fixture:
    desc: >-
      Regenerate the checked-in OCI image-layout fixture
      (tests/fixtures/oci-multilayer) from its generator,
      tests/oci_fixture/mod.rs, after a deliberate change to the generator.
      `cargo test --test oci_rootfs` fails while the two disagree.
    dir: '{{.TASKFILE_DIR}}/../..'
    env:
      RUSTC_WRAPPER: ''
      LEYLINE_BLESS_OCI_FIXTURE: '1'
    cmds:
      - cargo test -p leyline-runtime --test oci_rootfs checked_in_fixture_matches_its_generator

  test:cgroup:
    desc: >-
      Run the native tier's cgroup v2 ceiling tests against a real delegated
      cgroup (bead ley-line-open-da36d2). Linux only, and needs passwordless
      sudo once to delegate the cgroup; skips elsewhere, and fails on CI
      rather than skip when sudo is missing.
    dir: '{{.TASKFILE_DIR}}/../../..'
    cmds:
      - tools/test_runtime_cgroup.sh
