version: '3'

# Crate-scoped tasks for the embedded execution runtime. Included by the root
# Taskfile under the `runtime:` namespace; the root keeps compatibility aliases
# while this file owns the actual cargo invocation and local environment.

tasks:
  test:
    desc: >-
      Run embedded execution runtime tests (fake-worker contracts and the
      linked libkrun without a hypervisor), then the agent-in-guest
      end-to-end test (leyline-cli, tests/agent_in_guest.rs). Set
      LEYLINE_LIBKRUNFW_PATH to libkrunfw to also boot real guests, and
      LEYLINE_GUEST_TOOLS to the rootfs tools/guest_tools.sh writes for the
      end-to-end test; LEYLINE_REQUIRE_HYPERVISOR makes their absence fail
      instead of skip.
    dir: '{{.TASKFILE_DIR}}/../..'
    env:
      # Local developer toolchains commonly configure sccache globally. The
      # restricted runtime/UDS test harness cannot use that daemon reliably;
      # CI and local Taskfile invocation therefore share the direct rustc path.
      RUSTC_WRAPPER: ''
    cmds:
      - cargo test -p leyline-runtime
      # Builds on the worker binary the line above built.
      - cargo test -p leyline-cli --test agent_in_guest
