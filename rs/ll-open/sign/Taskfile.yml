version: '3'

# Crate-scoped tasks for `leyline-sign`.
#
# Included by the root Taskfile under the `sign:` namespace, so these run as
# `task sign:host:build`. The names are unchanged from when they lived in the
# root file — `sign:` was already their prefix there, so the include reproduces
# the exact same invocation.
#
# The `host` feature is in the not-shipping ledger of
# tools/check_feature_reachability.sh (ADR-0019: interactive HOST signing lives
# cloister-side, LLO ships verify-only). These tasks are what keep it compiled
# and tested despite not being in a shipping configuration — which is the whole
# reason the ledger entry is allowed to exist rather than the feature being
# deleted.

tasks:
  host:build:
    desc: Build leyline-sign with `host` + the gpgsm-compatible helper binary (ADR-0019)
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo build -p leyline-sign --features host
      - cargo build -p leyline-sign --features host --bin leyline-sign-helper

  host:test:
    desc: Tests for leyline-sign's `host` feature
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo test -p leyline-sign --features host

  # wasm32 publish pair (bead ley-line-open-a2099a). The feature pins are the
  # wasm32 discipline Cargo.toml documents: `root-signer` ON — browser-side
  # verification of a signed head is a wanted capability and the feature is
  # deliberately wasm32-reachable — and `host` OFF, since it is native-only
  # and gated so toggling it cannot change the wasm artifact. Output:
  # rs/target/wasm32-unknown-unknown/release/leyline_sign.wasm. The rustup
  # target itself comes from `task deps:wasm32` (root Taskfile).
  wasm:build:
    desc: Release wasm32 cdylib build of leyline-sign (root-signer ON, host OFF)
    dir: '{{.TASKFILE_DIR}}/../..'
    cmds:
      - cargo build --release -p leyline-sign --features root-signer --target wasm32-unknown-unknown

  # `--ignored`, not a default-run test: the assertion needs a wasm32
  # artifact on disk, which plain `cargo test --workspace` does not build.
  # Invoking it explicitly here keeps the gate loud — a missing or corrupt
  # artifact FAILS — while the workspace run reports it as ignored instead
  # of silently passing. WASM_ARTIFACT defaults to the local build output;
  # release.yml points it at the STAGED bytes.
  wasm:verify:
    desc: Parse WASM_ARTIFACT's export section and assert the exact exported surface
    dir: '{{.TASKFILE_DIR}}/../..'
    vars:
      WASM_ARTIFACT: '{{.WASM_ARTIFACT | default (printf "%s/../../target/wasm32-unknown-unknown/release/leyline_sign.wasm" .TASKFILE_DIR)}}'
    env:
      LEYLINE_WASM_ARTIFACT: '{{.WASM_ARTIFACT}}'
    cmds:
      - cargo test -p leyline-sign --test wasm_export_surface -- --ignored
