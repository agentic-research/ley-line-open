[package]
name = "leyline-storefs"
version = "0.20.5"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "The store-backed filesystem core behind LLO's virtio-fs device (ADR-0044 V2): FUSE-shaped requests answered from the store, writes landed as ADR-0042 proposals, refusals returned as Linux errno values."
repository = "https://github.com/agentic-research/ley-line-open"
publish = false

[dependencies]
# `source_write::propose` (ADR-0042), `checkout::reconcile` (ADR-0043 phase 0)
# and `daemon::db_pool::LiveDb` (the daemon's one writer + reader pool) live
# here. The dependency points down: cli-lib never depends on this crate, and
# neither may leyline-runtime (cli-lib depends on it), so the libkrun adapter
# is built by whoever links both — see README.md.
# Default features off: the CLI that links this crate picks cli-lib's
# features; nothing here needs lsp, hdc or cdc.
leyline-cli-lib = { path = "../cli-lib", default-features = false }
leyline-core = { path = "../../ll-core/core" }
# The share wire (`backends::libkrun::share`): the request and reply types the
# adapter answers, and the workspace-share seam the libkrun backend calls.
# Without `vmm`: the daemon serves shares; it never links the VMM.
leyline-runtime = { path = "../runtime", default-features = false }
anyhow = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "serialize"] }

[dev-dependencies]
tempfile = { workspace = true }
# A daemon context's event router spawns its dispatch loop on a runtime.
tokio = { workspace = true, features = ["rt", "macros"] }
# The share tests build a DaemonContext as the shipped daemon does, and the
# shipped daemon carries the sheaf state (cli-lib's default `sheaf` feature).
leyline-cli-lib = { path = "../cli-lib", default-features = false, features = ["sheaf"] }
