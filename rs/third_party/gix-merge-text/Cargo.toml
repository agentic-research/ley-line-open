# The builtin text merge driver of gix-merge 0.17.0, vendored (bead
# ley-line-open-ed4736). rs/third_party/README.md says why and how.
#
# Not a workspace member (rs/Cargo.toml `exclude`).
[package]
name = "gix-merge-text"
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "gix-merge 0.17.0's builtin text merge driver, vendored for LLO's ADR-0045 three-way merge."

[lib]
path = "src/lib.rs"

[dependencies]
bstr = { version = "1.12.0", default-features = false, features = ["alloc"] }
imara-diff = { package = "gix-imara-diff", version = "=0.2.3" }
